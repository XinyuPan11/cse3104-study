          ['把一条长查询拆成几步，自己读着方便', 1],
          ['调试时临时看一眼中间结果', 1],
        ],
        why: 'view 是<b>永久的数据库对象</b>：有名字、有权限、要有人维护。适合<b>共享逻辑、控制权限、做抽象层</b>（底层拆表了，view 还保持旧样子）。只是想让一条查询好读？用子查询或 WITH（第 4 课）就够了。' },

      { t: 'idea', title: 'Schema = 数据库里的文件夹', icon: 'db',
        body: '<b>schema</b>（模式）把表、view 分组，像文件夹分文件。<code>McKelvey.students</code> 和 <code>ArtSci.students</code> 同名不冲突，还能按 schema 分别授权。',
        terms: [['schema', '模式 / 命名空间'], ['namespace', '命名空间'], ['multi-tenant', '多租户']],
        code: `-- PostgreSQL
CREATE SCHEMA ArtSci;
CREATE TABLE ArtSci.students
  (LIKE McKelvey.students INCLUDING ALL);  -- 照抄表结构`,
        tip: '同一个词两个意思：之前说的 schema 是“表的结构设计”；这里是“装表的命名空间”。',
        trap: '课件的 <code>CREATE TABLE ArtSci.students LIKE McKelvey.students</code> 是 <b>MySQL</b> 写法（MySQL 里 SCHEMA 就是 DATABASE）。SQLite 没有 CREATE SCHEMA，而是 <code>ATTACH DATABASE \'x.db\' AS McKelvey;</code> 挂上另一个数据库文件——本站的 McKelvey 就是这么来的。' },

      { t: 'grid', title: '本站数据库里的两个 schema',

    { id: 'c', title: 'IIF、CASE 与 COALESCE', min: 5, screens: [

      { t: 'match', q: '各种“一行 if / else”写法，分别是什么情况？',

          ['CASE WHEN …', '标准 SQL，所有数据库通用'],

        why: '考试和面试写 CASE 最稳：哪个数据库都能跑。IIF / IF 只是简写。' },

      { t: 'predict', lang: 'sql', run: true,
        q: 'Isabel（id 13）还没有 GPA，gpa 是 NULL。honor 会是？',

      { t: 'idea', title: 'CASE：多个分支', icon: 'sort',
        body: '<b>CASE</b> 从上往下检查每个 <code>WHEN</code>，<b>第一个</b>成立的分支胜出，后面的不再看；都不成立就用 <code>ELSE</code>，没写 ELSE 就得到 NULL。',

        tip: 'CASE 是标准 SQL，哪儿都能用。<code>IIF(c, a, b)</code> 就是 <code>CASE WHEN c THEN a ELSE b END</code> 的简写。' },

        body: '<b>WITH</b> 定义一个有名字的临时结果，叫 <b>CTE</b>（common table expression），后面像用表一样用它。它只活在<b>这一条语句</b>里。',

      { t: 'idea', title: '用取整来分档', icon: 'chart',
        body: '<code>FLOOR(x / 宽度) * 宽度</code> 把连续的数切成等宽的档：63 学分 → 63 ÷ 30 = 2.1 → FLOOR 得 2 → × 30 = <b>60 档</b>。再按档位 GROUP BY，就能数每档几个人。',
        code: `SELECT FLOOR(credits / 30.0) * 30 AS band,
       COUNT(*) AS n
FROM students
GROUP BY band
ORDER BY band;`,
        trap: '课件这一页写的是 <code>ORDER BY salary_band DESC</code>，下面的结果表却是 70000、80000、90000——<b>升序</b>。查询和结果对不上：按 DESC 应该是 90000 排在最前。' },

    { id: 'o1', q: 'When would you add an index to a table, and what does it cost?', zh: '什么时候加索引？代价是什么？',
      points: [
        'An index is a sorted structure (usually a B-tree) on one or more columns, with pointers back to the rows',
        'Lookups go from a full table scan (linear) to a few tree levels (logarithmic)',
        'Worth it on large tables, for columns used often in WHERE, JOIN, or ORDER BY',
        'Cost: every INSERT, UPDATE, and DELETE must also maintain the index, plus extra storage',
        'Check it is actually used with EXPLAIN (SCAN vs SEARCH USING INDEX)',
      ],
      model: "An index is basically a sorted copy of one or more columns, usually stored as a B-tree, with pointers back to the rows. Without it the database has to scan every row; with it, it walks down a few levels of the tree, so a lookup goes from linear to logarithmic time. I'd add one on a large table for columns that show up a lot in WHERE clauses, joins, or ORDER BY, like looking students up by last name. The cost is on the write side: every insert, update, or delete also has to update the index, and it takes extra disk space, so I wouldn't index a tiny table or a write-heavy log table. And I'd confirm it's used with EXPLAIN QUERY PLAN, looking for SEARCH USING INDEX instead of SCAN." },

    { id: 'o2', q: 'What is the difference between a view and a materialized view? When would you use a view?', zh: 'view 和物化 view 的区别？什么时候用 view？',
      points: [
        'A view is a stored query; it stores no data and re-runs every time it is queried',
        'So a view is always up to date, but can be slow if it is complex and used often',
        'A materialized view stores the result on disk: fast to read, but it goes stale and must be refreshed',
        'Use views to share business logic, control permissions, or keep an abstraction layer when tables change',
        'For a one-off query, a subquery or WITH is simpler; SQLite has no materialized views (CREATE TABLE AS works as a snapshot)',
      ],
      model: "A view is just a named, stored query. It doesn't hold any data, so every time you select from it the database runs the underlying query, which means it's always current but can be slow if the query is expensive. A materialized view actually stores the result on disk, so reading it is as fast as reading a table, but when the base tables change it goes stale until it's refreshed. I'd use a regular view to hide complicated logic behind a simple name, to give someone access to some columns but not others, or to keep old reports working when the underlying tables get reorganized. If I only need to make one query easier to read, I'd use a WITH clause instead. SQLite doesn't have materialized views, so there I'd use CREATE TABLE AS SELECT as a snapshot and rebuild it when needed." },

    { id: 'o3', q: 'What is SQL injection, and how do you prevent it?', zh: '什么是 SQL 注入？怎么防？',
      points: [
        'It happens when user input is concatenated directly into a SQL string',
        "A quote in the input can break out of the string literal; the classic x' OR '1'='1 makes the WHERE clause always true",
        'Fix: parameterized queries / prepared statements: the SQL is parsed first, values are bound as data',
        'f-strings, % formatting, or stripping quotes by hand are not real fixes',
        'Defense in depth: least-privilege database accounts; whitelist table or column names, since placeholders only work for values',
      ],
      model: "SQL injection happens when an application builds a query by pasting user input straight into the SQL string. If the input contains a quote, it can close the string early and the rest gets run as SQL; the textbook example is typing x' OR '1'='1 into a search box, which makes the WHERE clause always true and returns the whole table. The fix is to use parameterized queries: you send the SQL with placeholders like a question mark, the database parses that structure first, and the user's value is bound separately as plain data, so it can never change the query. Building the string with f-strings or percent formatting, or trying to strip quotes yourself, doesn't count. On top of that I'd give the application's database account only the permissions it needs." },

      { t: 'code', title: 'Python：出错自动回滚', lang: 'py',

          { line: 5, text: '<code>with conn:</code> 把块里的语句当成一个事务：正常结束自动 COMMIT，抛异常自动 ROLLBACK' },

        why: 'SQLite 写 <code>BEGIN</code> … <code>COMMIT</code>（<code>END</code> 是 COMMIT 的别名），放弃就 <code>ROLLBACK</code>。<br>不写 BEGIN 时是 <b>autocommit</b>：每条语句自己就是一个事务，执行完立刻提交——这时再 ROLLBACK 会报错 "no transaction is active"。' },
      { t: 'recap', points: [

          { text: 'FK 放在 employees.laptop_id，指向 laptops.asset_id', on: ['r0'] },
          { text: '1:1 常常是对称的：也可以反过来在 laptops 里放 emp_id。看哪边更稳定、哪边可能为空', on: ['l'] } ] },
      { t: 'fill', q: 'FK 只保证“这台电脑存在”。再加哪个约束，才能保证一台电脑不会配给两个人（真正的 1:1）？', lang: 'sql',
        tpl: 'CREATE TABLE employees (\n  emp_id    INTEGER PRIMARY KEY,\n  name      TEXT NOT NULL,\n  laptop_id INTEGER {0}\n            REFERENCES laptops(asset_id)\n);',
        blanks: [{ a: ['UNIQUE'] }],
        why: '没有 UNIQUE，两个员工能填同一个 laptop_id —— 那其实是 N:1。<b>FK + UNIQUE = 1:1</b>。还没配电脑的员工填 NULL 即可（SQLite 等多数数据库允许 UNIQUE 列有多个 NULL）。' },
      { t: 'quiz', q: '既然是 1:1，为什么不干脆把 laptops 的列并进 employees，变成一张表？',
        opts: ['笔记本是独立的实体：会换人、会闲置，有自己的属性', 'SQL 表达不了 1:1 关系', '合并后查询一定更慢', '合并后 emp_id 就不能当主键了'], a: 0,
        why: '电脑可以闲置（没主人），员工离职后电脑转给别人 —— 合成一张表，这些情况又会变回插入 / 删除异常。所以 1:1 也常常“still want to separate the entities”。' },
      { t: 'rows', title: '自引用：经理也是员工',

        frames: [

          { text: 'Dan 的经理？manager_id = 2 → 回本表找 emp_id 2：Ben', hl: { m4: 'focus', m2: 'pass' }, badge: { m4: '→ 2' } },

      { t: 'quiz', q: '不是每个员工都有公司车。<code>employees.car_id</code>（FK → company_cars）该怎么定义？',

        why: '课件记法：<b>1:1</b> 表示 mandatory（必须有），<b>0:1</b> 表示 optional（可以没有）。落到 SQL：FK 列 NOT NULL ↔ 必须；允许 NULL ↔ 可选。图上要标清楚，因为它决定约束怎么写。' },

    /* ───────────── d · 多对多与 junction table ───────────── */
    { id: 'd', title: '多对多与 junction table', min: 6, screens: [
      { t: 'hook', big: '一个订单只能买一件商品？？', sub: '用一个 FK 硬连多对多，会发生什么', icon: 'bag' },
      { t: 'er', title: '用一个 FK 连商品和订单',
        ents: [
          { id: 'p', name: 'products', cols: ['product_id PK', 'name', 'price', 'qty_in_stock'], x: 0, y: 0 },
          { id: 'o', name: 'orders', cols: ['order_id PK', 'customer_id FK', 'order_date', 'product_id FK', 'quantity'], x: 1, y: 0 } ],
        rels: [{ a: 'p', b: 'o', card: '1:N' }],
        frames: [
          { text: '订单里买的东西，用 product_id 这个 FK 指向 products', on: ['p', 'o'] },
          { text: '一个商品可以出现在很多订单里：products 1 — N orders', on: ['r0'] },
          { text: '可是 orders 每行只有<b>一个</b> product_id 格子……', on: ['o'] } ] },
      { t: 'quiz', q: 'Ann 想<b>一次下单</b>买 Cat Hammock 和 Glow Mug。在上面的设计里会怎样？',
        opts: ['没问题，product_id 可以存两个值', '只能拆成两个订单，或者把订单行抄两遍', '在 products 里加一列 order_id 就行', 'SQL 会自动建一张关联表'], a: 1,
        why: '订单 ↔ 商品其实是 <b>N:M</b>：一单多件商品，一件商品在很多单里。⚠ 课件 “Relating Tables” 那页的 Orders 就只有一个 ProductID (FK)，和下一页 “each order can contain multiple products” 矛盾 —— 那页只是在演示 PK/FK 怎么连，不是完整设计。' },
      { t: 'rows', title: '硬塞的后果',
        cols: ['order_id', 'customer', 'order_date', 'product'],
        rows: [
          { k: 'r1', v: [1, 'Bo', '10-01', 'Desk Cactus'] },
          { k: 'r2', v: [2, 'Ann', '10-02', 'Cat Hammock'] } ],
        frames: [
          { text: 'orders 每行一个商品：Bo 的订单 1，Ann 的订单 2' },
          { text: 'Ann 的订单 2 还要 Glow Mug，只能再抄一行：order_id 2 出现两次 → <b>主键失效</b>，顾客、日期也重复了', rows: [
              { k: 'r1', v: [1, 'Bo', '10-01', 'Desk Cactus'] },
              { k: 'r2', v: [2, 'Ann', '10-02', 'Cat Hammock'] },
              { k: 'r3', v: [2, 'Ann', '10-02', 'Glow Mug'] } ], hl: { r2: 'warn', r3: 'fail' }, badge: { r2: 'order_id 2', r3: 'order_id 2 ✗' } },
          { text: '解法：订单本身留在 orders（一单一行），“订单里有什么” 搬进新表 <b>order_items</b>：一行 = 一个 (订单, 商品) 配对', cols: ['order_id', 'product_id', 'quantity'], rows: [
              { k: 'i1', v: [1, 103, 1] },
              { k: 'i2', v: [2, 101, 1] },
              { k: 'i3', v: [2, 104, 2] } ], hl: { i1: 'new', i2: 'new', i3: 'new' } },
          { text: '主键是两列组合 (order_id, product_id)：订单 2 有两件商品，完全合法', hl: { i2: 'pass', i3: 'pass' }, badge: { i2: '(2, 101)', i3: '(2, 104)' } } ] },
      { t: 'er', title: 'junction table：一个 N:M = 两个 1:N',
        ents: [
          { id: 'o', name: 'orders', cols: ['order_id PK', 'customer_id FK', 'order_date'], x: 0, y: 0 },
          { id: 'i', name: 'order_items', cols: ['order_id PK FK', 'product_id PK FK', 'quantity', 'unit_price'], x: 1, y: 0 },
          { id: 'p', name: 'products', cols: ['product_id PK', 'name', 'price', 'qty_in_stock'], x: 2, y: 0 } ],
        rels: [{ a: 'o', b: 'i', card: '1:N' }, { a: 'p', b: 'i', card: '1:N' }],
        frames: [
          { text: '逻辑上：orders 和 products 是 N:M', on: ['o', 'p'] },
          { text: '中间加一张 <b>junction table</b>（也叫 join / bridge / associative table）', on: ['i'] },
          { text: 'orders 1 — N order_items：一张订单有好几行', on: ['r0'] },
          { text: 'products 1 — N order_items：一件商品出现在很多订单里', on: ['r1'] },
          { text: 'quantity、unit_price 描述的是“这一次购买”，只能放在 junction 里。unit_price 记下单时的价格：商品以后涨价，旧订单不受影响', on: ['i'] } ] },
      { t: 'quiz', q: '员工 ↔ 项目也是 N:M。“Alice 在项目 X 投入 50% 精力” 这个数字，应该存在哪？',
        opts: ['employees 表', 'projects 表', '员工-项目的 junction table（如 assignments）', 'employees 和 projects 各存一份'], a: 2,
        why: '50% 不属于 Alice（她在别的项目可能是 20%），也不属于项目 X，而属于 “Alice × 项目 X” 这个<b>配对</b>。只画一条 N:M 线的<b>逻辑图</b>能表达业务规则，却没地方写这种关系属性；落到 <b>schema</b> 时要画出 junction table。' },
      { t: 'fill', q: '把员工 ↔ 项目落成 junction table。填空：', lang: 'sql',
        tpl: 'CREATE TABLE assignments (\n  emp_id         INTEGER REFERENCES employees(emp_id),\n  project_id     INTEGER REFERENCES {0}(project_id),\n  assigned_date  TEXT,\n  percent_effort REAL,\n  PRIMARY KEY ({1})\n);',
        blanks: [{ a: ['projects'] }, { a: ['emp_id, project_id', 'project_id, emp_id', 'emp_id,project_id', 'project_id,emp_id'] }],
        why: '两个 FK 各指向一边；主键 = 两个 FK 的组合（<b>composite key</b>，复合键），同一个人不会被重复分配到同一个项目。如果允许“离开后再回来”，就得把 assigned_date 也放进主键。' },
      { t: 'sql', title: '穿过 junction table 查询',
        task: '谁买过 <b>Glow Mug</b>？列出顾客的 <code>name</code>。<br>路线：customers → orders → <b>order_items</b> → products（N:M 查询 = 连走两段 1:N）。',
        sql: 'SELECT c.name\nFROM customers AS c\nJOIN orders AS o ON o.customer_id = c.customer_id\n-- 继续 JOIN order_items 和 products，再筛出 Glow Mug\n',
        check: "SELECT c.name FROM customers AS c JOIN orders AS o ON o.customer_id = c.customer_id JOIN order_items AS oi ON oi.order_id = o.order_id JOIN products AS p ON p.product_id = oi.product_id WHERE p.name = 'Glow Mug';",
        hint: "<code>JOIN order_items AS oi ON oi.order_id = o.order_id JOIN products AS p ON p.product_id = oi.product_id WHERE p.name = 'Glow Mug'</code>" },
      { t: 'er', title: '这条线多余吗？',
        ents: [
          { id: 's', name: 'students', cols: ['student_id PK', 'name', 'teacher_id FK'], x: 0, y: 0 },
          { id: 't', name: 'teachers', cols: ['teacher_id PK', 'name', 'email'], x: 1, y: 0 },
          { id: 'e', name: 'enrollments', cols: ['student_id PK FK', 'course_id PK FK'], x: 0, y: 1 },
          { id: 'c', name: 'courses', cols: ['course_id PK', 'title', 'teacher_id FK'], x: 1, y: 1 } ],
        rels: [{ a: 's', b: 'e', card: '1:N' }, { a: 'c', b: 'e', card: '1:N' }, { a: 't', b: 'c', card: '1:N' }, { a: 't', b: 's', card: '1:N', label: '?' }],
        frames: [
          { text: '学生 ↔ 课程是 N:M，经过 enrollments', on: ['s', 'e', 'c', 'r0', 'r1'] },
          { text: '每门课一个任课老师：teachers 1 — N courses', on: ['t', 'r2'] },
          { text: '有人又在 students 里加了 teacher_id，想记“学生的老师”', on: ['r3'] },
          { text: '可顺着 学生 → enrollments → 课程 → 老师 就能查到！能从别的路径推出来的关系叫 <b>redundant relationship</b>（冗余关系），存两份迟早对不上', on: ['r0', 'r1', 'r2'] } ] },
      { t: 'idea', title: '冗余，还是另一种含义？', icon: 'warn',
        body: '判断冗余：这条关系能不能从别的路径推出来？能 → 删掉。但如果 students.teacher_id 表示<b>导师</b>（advisor），那是另一个事实，就不冗余。',
        trap: '课件这页的 Course 表用 CourseName 当 PK，又放了一个 StudentID (FK) —— 这样<b>每门课只能有一个学生</b>！学生 ↔ 课程是 N:M，应该像上图那样用 enrollments 连接；课名也会改，不适合当主键。' },
      { t: 'quiz', q: 'orders 里已经有 customer_id。有人想在 <b>order_items</b> 里也加一列 customer_id，“方便查询”。这条关系是？',
        opts: ['冗余：顺着 order_id → orders.customer_id 就能查到', '必须加，否则查不到是谁买的', '应该改成 N:M', '应该放进 products 表'], a: 0,
        why: '存两份就可能不一致：order_items 写 Ann、orders 写 Bo，听谁的？真为了速度故意这么做，叫 <b>denormalization</b>（反规范化），c08 再谈取舍。' },
      { t: 'recap', points: [
        'N:M 不能靠一个 FK：一个格子只装一个值',
        '<b>junction table</b> 把 N:M 拆成两个 1:N；两个 FK 组成复合主键',
        '关系自己的属性（quantity、percent_effort）只能放在 junction 里',
        '逻辑图可以画 N:M 线；schema 要落成 junction table',
        '能从别的路径推出来的关系是<b>冗余</b>的 —— 删掉，除非含义不同' ] },

    /* ───────────── e · 超键、候选键、主键 ───────────── */
    { id: 'e', title: '超键、候选键、主键', min: 6, screens: [
      { t: 'hook', big: '名字能当主键吗？Email 呢？学号呢？', sub: '从关系理论的老名词，到挑一个好主键', icon: 'key' },
      { t: 'match', q: '关系理论（E. F. Codd, 1970）用的是数学名词。注意：<b>relational</b> 里的 relation 指的就是<b>表</b>本身！连线：',
        pairs: [
          ['relation', 'table 表'],
          ['tuple', 'row / record 行'],
          ['attribute', 'column 列'],
          ['domain', '一列允许取的值的集合'],
          ['relationship', '表与表之间的联系（1:N 等）'] ],
        why: 'relation ≠ relationship：前者是表（一组 tuple 的集合），后者是 ER 图里的连线。很多人以为 “relational” 是因为表之间有关系 —— 其实是因为表就叫 relation。' },
      { t: 'grid', title: '哪些列能唯一确定一行？',
        frames: [
          { text: '一张航班表。哪些列的组合能唯一确定一行？',
            colLabels: ['FlightNo', 'Date', 'Origin', 'Dest', 'Gate'],
            cells: [['AA123', '09-30', 'STL', 'ORD', 'B4'], ['AA123', '10-01', 'STL', 'ORD', 'B6'], ['UA88', '09-30', 'STL', 'DEN', 'C2'], ['UA88', '10-01', 'STL', 'DEN', 'C2']] },
          { text: '{FlightNo} 不行：航班号每天都在重复用 → 不是 superkey', markCols: { 0: 'a' }, mark: { '0,0': 'x', '1,0': 'x', '2,0': 'x', '3,0': 'x' } },
          { text: '{FlightNo, Date}：4 个组合各不相同 → <b>superkey</b>（超键）。去掉任一列就重复 → 它是最小的 → <b>candidate key</b>（候选键）', markCols: { 0: 'a', 1: 'a' } },
          { text: '{FlightNo, Date, Gate} 也唯一，所以也是 superkey —— 但 Gate 是多余的，不最小 → 不是 candidate key', markCols: { 0: 'b', 1: 'b', 4: 'b' } },
          { text: '所有列合在一起，永远是 superkey（最“笨”的那个，<b>trivial superkey</b>）', markCols: { 0: 'd', 1: 'd', 2: 'd', 3: 'd', 4: 'd' } },
          { text: '{Date, Origin, Dest} 在这 4 行里碰巧不重复…… 但 AA 和 UA 完全可以同一天都飞 STL→ORD。键由<b>业务规则</b>决定，不由眼前的数据决定', markCols: { 1: 'c', 2: 'c', 3: 'c' } } ] },
      { t: 'idea', title: '超键 ⊇ 候选键 ⊇ 主键', icon: 'key',
        body: '<b>Superkey</b>：任何能唯一确定一行的列集合。<b>Candidate key</b>：最小的 superkey，少一列就不唯一。<b>Primary key</b>：设计者从候选键里挑定的那一个。',
        terms: [['superkey', '超键'], ['candidate key', '候选键'], ['primary key', '主键'], ['alternate key', '备用键']],
        tip: '没被选中的候选键叫 <b>alternate key</b>，通常加 <code>UNIQUE</code>。主键 = UNIQUE + NOT NULL，每表只有一个（SQLite 小坑：非 INTEGER 的主键要自己写 NOT NULL，否则允许 NULL）。',
        trap: '课件写 “Every attribute is the trivial superkey”，容易读成“每一列都是超键” —— 错（FlightNo 单独就不是）。正确说法：<b>全部 attribute 合在一起</b>是 trivial superkey（前提是没有两行完全相同）。' },
      { t: 'sort', q: '<code>enrollments(StudentID, CourseID, Semester, EnrollDate, Grade)</code><br>规则：同一学期、同一门课，一个学生只选一次（可以下学期重修）。把这些列集合分类：',
        buckets: ['candidate key', 'superkey 但不最小', '不是 superkey'],
        items: [
          ['{StudentID, CourseID, Semester}', 0],
          ['{StudentID, CourseID, Semester, Grade}', 1],
          ['全部 5 列', 1],
          ['{StudentID, CourseID}', 2],
          ['{StudentID, Semester}', 2],
          ['{CourseID, Semester}', 2],
          ['{Grade}', 2] ],
        why: '{StudentID, CourseID} 不够：重修时同一对出现在两个学期。{StudentID, CourseID, Semester} 去掉任何一列都不再唯一 → 最小 → candidate key；再往里加 Grade 之类仍然唯一，但只是 superkey。' },
      { t: 'quiz', q: '购物车 <code>cart_items(UserID, ProductID, Quantity)</code>：同一用户的同一商品只占一行（再加购就改 Quantity）。<code>{UserID, ProductID, Quantity}</code> 是？',
        opts: ['candidate key', 'superkey，但不是 candidate key', '不是 superkey', '一定是 primary key'], a: 1,
        why: '它能唯一确定一行（因为 {UserID, ProductID} 已经能了），但 Quantity 是多余的 → 不最小。去掉 Quantity，{UserID, ProductID} 才是 candidate key。' },
      { t: 'sql', title: '用数据“推翻”一个键',
        task: '数据能<b>推翻</b>一个键，但不能<b>证明</b>它。找出 <code>flights</code> 表里出现超过一次的 <code>flight_no</code>，输出 <code>flight_no</code> 和次数 <code>n</code> 两列。<br>有结果 → flight_no 单独不是 superkey。（拿到新数据集时，先这样查一查“ID 列”是不是真的唯一。）',
        sql: 'SELECT flight_no, COUNT(*) AS n\nFROM flights\n-- 按 flight_no 分组，只留出现次数 > 1 的\n',
        check: 'SELECT flight_no, COUNT(*) AS n FROM flights GROUP BY flight_no HAVING COUNT(*) > 1;',
        hint: '<code>GROUP BY flight_no HAVING COUNT(*) > 1</code>' },
      { t: 'quiz', q: 'users 表用 <code>email</code> 当主键，orders 里也用 email 当 FK 指向用户。最大的隐患是？',
        opts: ['email 太长，SQL 不允许它当主键', '用户换 email 时，所有引用它的行都得跟着改', '主键必须是数字', 'email 列不能建索引'], a: 1,
        why: '好主键要<b>稳定</b>。email 会换，名字会改（还会重名）。一变，别的表里的 FK 就成了指向旧值的 <b>stale reference</b>（过期引用）。' },
      { t: 'rows', title: 'natural key 的坑：航班改期',
        cols: ['booking', 'flight_no', 'date', 'seat'],
        rows: [
          { k: 'b1', v: ['B1', 'AA123', '09-30', '12A'] },
          { k: 'b2', v: ['B2', 'AA123', '09-30', '14C'] },
          { k: 'b3', v: ['B3', 'UA88', '09-30', '3F'] } ],
        frames: [
          { text: 'bookings 用 <b>natural key</b>（自然键）(flight_no, date) 引用航班' },
          { text: 'AA123 改到 10-01。flights 表改了，这两行还写着 09-30 —— 指向一个不存在的航班', hl: { b1: 'fail', b2: 'fail' }, badge: { b1: 'stale', b2: 'stale' } },
          { text: '只能把所有引用它的行一起改（手动，或 <code>ON UPDATE CASCADE</code>）；漏一张表就出错', vals: { b1: ['B1', 'AA123', '10-01', '12A'], b2: ['B2', 'AA123', '10-01', '14C'] }, hl: { b1: 'warn', b2: 'warn' } },
          { text: '换成 <b>surrogate key</b>（代理键）：flights 有一个和航班信息无关的 flight_id', cols: ['booking', 'flight_id', 'seat'], vals: null, rows: [
              { k: 'b1', v: ['B1', 7, '12A'] },
              { k: 'b2', v: ['B2', 7, '14C'] },
              { k: 'b3', v: ['B3', 8, '3F'] } ] },

/* ───────── result grids ───────── */
function cellHTML(v) {
  if (v === null || v === undefined) return '<span class="null">NULL</span>';
  if (v instanceof Uint8Array) return '<span class="null">[blob]</span>';
  if (typeof v === 'number') return `<span class="num">${esc(fmtNum(v))}</span>`;

}
function gridHTML(set, { max = 200, caption = '' } = {}) {
  const rows = set.values.slice(0, max);
  let h = '<div class="grid-wrap"><table class="grid"><thead><tr><th class="rn">#</th>' + set.columns.map((c) => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach((r, i) => { h += `<tr><td class="rn">${i + 1}</td>` + r.map((v) => `<td>${cellHTML(v)}</td>`).join('') + '</tr>'; });
  h += '</tbody></table></div>';
  const more = set.values.length > max ? `，只显示前 ${max} 行` : '';
  h += `<div class="grid-foot">${set.values.length} 行 × ${set.columns.length} 列${more}${caption ? ' · ' + caption : ''}</div>`;
  return h;
}
function resultHTML(res) {
  if (res.error) {
    const why = explainErr(res.error);
    return `<div class="sqlerr"><div class="sqlerr-m">✕ ${esc(res.error)}</div>${why ? `<div class="sqlerr-why">${why}</div>` : ''}</div>`;
  }
  if (!res.sets.length) return `<div class="okmsg">执行成功 · 影响 ${res.modified} 行（这条语句不返回结果行）</div>`;
  return res.sets.map((s) => gridHTML(s)).join('');
}
function staticTable(head, rows, cls = '') {
  return `<div class="grid-wrap"><table class="grid ${cls}"><thead><tr>` + head.map((c) => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + r.map((v) => `<td>${cellHTML(v)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
}
function compareSets(u, r, ordered) {
  if (!u) return { ok: false, msg: '你的语句没有返回结果。这道题需要一条 SELECT 查询。' };
  if (!r) return { ok: false, msg: '参考答案没有结果（题目配置问题）。' };
  const norm = (row) => row.map((v) => (v === null ? null : typeof v === 'number' ? Math.round(v * 100) / 100 : String(v)));
  const U = u.values.map(norm);
  const R = r.values.map(norm);
  const key = (x) => JSON.stringify(x);
  const tup = (x) => `<code>(${x.map((v) => esc(fmtNum(v))).join(', ')})</code>`;
  if (u.columns.length !== r.columns.length) return { ok: false, msg: `列数不对：你返回了 ${u.columns.length} 列（${u.columns.map(esc).join(', ')}），题目要 ${r.columns.length} 列。` };
  if (U.length !== R.length) {
    const rs = new Set(R.map(key));
    const extra = U.find((x) => !rs.has(key(x)));
    const us = new Set(U.map(key));
    const miss = R.find((x) => !us.has(key(x)));
    return { ok: false, msg: `行数不对：你得到 ${U.length} 行，期望 ${R.length} 行。` + (extra ? ` 比如你多了 ${tup(extra)}。` : miss ? ` 比如你少了 ${tup(miss)}。` : '') };
  }
  const su = U.map(key).sort();
  const sr = R.map(key).sort();
  if (!su.every((x, i) => x === sr[i])) {
    const perm = (rows) => rows.map((x) => JSON.stringify(x.slice().map(String).sort())).sort();
    const pu = perm(U);
    const pr = perm(R);
    if (pu.every((x, i) => x === pr[i])) return { ok: false, msg: '数据对了，但<b>列的顺序</b>和题目要求的不一样。' };
    const us = new Set(U.map(key));
    const miss = R.find((x) => !us.has(key(x)));
    return { ok: false, msg: `有些行的内容不对。比如期望结果里有 ${tup(miss)}，你的结果里没有。` };
  }
  if (ordered && !U.every((x, i) => key(x) === key(R[i]))) return { ok: false, msg: '行都对了，但<b>顺序</b>不对。检查 ORDER BY（升序还是降序？按哪一列？）。' };
  return { ok: true };
}

/* ───────── step player ───────── */
function mkPlayer(host, n, show, { interval = 1300, caption, auto = false } = {}) {
  const bar = el('div', 'pl');
  bar.innerHTML = `<button type="button" class="pl-b" data-a="reset" title="回到第一步" aria-label="回到第一步">${icon('first')}</button>
    <button type="button" class="pl-b" data-a="prev" aria-label="上一步">${icon('back')}</button>
    <button type="button" class="pl-play" data-a="play"></button>
    <button type="button" class="pl-b" data-a="next" aria-label="下一步">${icon('next')}</button>
    <div class="pl-dots" aria-hidden="true"></div>
    <label class="pl-sp"><span class="sr-only">播放速度</span><select><option value="1.7">慢</option><option value="1" selected>中</option><option value="0.5">快</option></select></label>`;
  host.append(bar);
  const cap = caption || el('div', 'cap');
  if (!caption) host.append(cap);
  let i = 0;
  let timer = null;
  let N = n;
  const q = (a) => bar.querySelector(`[data-a="${a}"]`);
  const sp = bar.querySelector('select');
  const dots = bar.querySelector('.pl-dots');
  const drawDots = () => { dots.innerHTML = N <= 24 ? Array.from({ length: N }, (_, k) => `<i data-k="${k}"></i>`).join('') : '<b></b>'; };
  drawDots();
  const upd = () => {
    if (N <= 24) [...dots.children].forEach((d, k) => { d.className = k < i ? 'd' : k === i ? 'on' : ''; });
    else dots.firstChild.style.width = (N > 1 ? (i / (N - 1)) * 100 : 100) + '%';
    q('prev').disabled = i === 0;
    q('next').disabled = i >= N - 1;
    q('play').innerHTML = timer ? `${icon('pause')}<span>暂停</span>` : i >= N - 1 ? `${icon('undo')}<span>重播</span>` : `${icon('play')}<span>播放</span>`;
  };
  const go = (k) => {
    i = Math.max(0, Math.min(N - 1, k));
    const c = show(i);
    if (c != null) { cap.innerHTML = c; cap.classList.remove('in'); void cap.offsetWidth; cap.classList.add('in'); }
    upd();
  };
  const stop = () => { clearTimeout(timer); timer = null; upd(); };
  const tick = () => {
    if (!bar.isConnected || i >= N - 1) return stop();
    go(i + 1);
    timer = setTimeout(tick, interval * Number(sp.value));
    upd();
  };
  const play = () => {
    if (timer) return stop();
    if (i >= N - 1) go(0);
    timer = setTimeout(tick, Math.min(600, interval * Number(sp.value)));
    upd();
  };
  bar.addEventListener('click', (e) => {
    const a = e.target.closest('button')?.dataset.a;
    if (!a) return;
    if (a === 'play') return play();
    stop();
    if (a === 'reset') go(0);
    if (a === 'prev') go(i - 1);
    if (a === 'next') go(i + 1);
  });
  go(0);
  if (auto && !REDUCED) setTimeout(() => { if (bar.isConnected && !timer && i === 0) play(); }, 900);
  return { go, stop, play, get i() { return i; }, setN(k) { N = k; stop(); drawDots(); go(0); }, cap };
}

/* ───────── sound (off by default) + confetti ───────── */
const Sound = {
  ctx: null,
  play(kind) {
    if (!S.sound) return;
    try {
      this.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      const notes = { ok: [660, 880], bad: [196, 165], done: [523, 659, 784, 1046], tap: [520] }[kind] || [440];
      notes.forEach((f, i) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = kind === 'bad' ? 'triangle' : 'sine';
        o.frequency.value = f;
        const t = this.ctx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(kind === 'tap' ? 0.05 : 0.12, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g).connect(this.ctx.destination);
        o.start(t);
        o.stop(t + 0.25);
      });
    } catch (e) { /* audio unavailable */ }
  },
};
function confetti(hue = 220) {
  if (REDUCED) return;
  const c = el('canvas', 'confetti');
  document.body.append(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr;
  c.height = innerHeight * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const hues = [hue, hue + 60, hue + 150, 45, 160, 330];
  const P = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.45,
    vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 4,
    r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4,
    c: `hsl(${hues[Math.floor(Math.random() * hues.length)] % 360} 85% 58%)`,
  }));
  const t0 = performance.now();
  const step = (t) => {
    const dt = Math.min(32, t - (step.t || t)) / 16;
    step.t = t;
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach((p) => {
      p.vy += 0.38 * dt;
      p.vx *= 0.99;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.a += p.va * dt;
      x.save();
      x.translate(p.x, p.y);
      x.rotate(p.a);
      x.fillStyle = p.c;
      x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      x.restore();
    });
    if (t - t0 < 2200) requestAnimationFrame(step);
    else c.remove();
  };
  requestAnimationFrame(step);
}

/* ───────── tiny markdown for AI answers ───────── */
function md(src) {
  const parts = String(src).split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let out = '';
  const inl = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  for (let i = 0; i < parts.length; i += 3) {
    const txt = parts[i];
    if (txt) {
      out += txt.split(/\n{2,}/).map((p) => {
        const lines = p.split('\n');
        if (lines.every((l) => /^\s*([-*]|\d+\.)\s+/.test(l) || !l.trim())) return '<ul>' + lines.filter((l) => l.trim()).map((l) => `<li>${inl(l.replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`).join('') + '</ul>';
        if (/^#{1,4}\s/.test(p)) return `<p><b>${inl(p.replace(/^#{1,4}\s/, ''))}</b></p>`;
        return `<p>${lines.map(inl).join('<br>')}</p>`;
      }).join('');
    }
    if (parts[i + 2] != null) out += codeBlock(parts[i + 2].replace(/\n$/, ''), /py/.test(parts[i + 1]) ? 'py' : /html/.test(parts[i + 1]) ? 'html' : 'sql');
  }
  return out;
}

    };

      const nm = m ? m[1] : c;
      const tags = m ? m[2].toUpperCase().split(/[,\s]+/).filter(Boolean) : [];
      return `<div class="ent-c"><span>${esc(nm)}</span>${tags.map((t) => `<i class="${t.toLowerCase()}">${t}</i>`).join('')}</div>`;
    }).join(''));
    x.style.gridColumn = e.x + 1;
    x.style.gridRow = e.y + 1;
    E[e.id] = x;
    box.append(x);
  });
  for (let r = 1; r <= nr; r++) if (!s.ents.some((e) => e.y + 1 === r)) box.append(Object.assign(el('div'), { style: `grid-row:${r};height:20px` }));
  wrap.append(box);
  b.append(wrap);
  const ends = { '1:1': ['1', '1'], '1:N': ['1', 'N'], 'N:1': ['N', '1'], 'N:M': ['N', 'M'] };
  const g = $('g', svgEl);
  let state = { vis: null, on: null };
  const draw = () => {
    if (!box.isConnected) return;
    const bb = box.getBoundingClientRect();
    $('svg', svgEl).setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);
    const edge = (r, tx, ty) => {
      const cx = r.left + r.width / 2 - bb.left;
      const cy = r.top + r.height / 2 - bb.top;
      const dx = tx - cx;
      const dy = ty - cy;
      const t = Math.min((r.width / 2) / Math.abs(dx || 1e-6), (r.height / 2) / Math.abs(dy || 1e-6));
      return [cx + dx * t, cy + dy * t, cx, cy];
    };
    g.innerHTML = (s.rels || []).map((r, i) => {
      const ra = E[r.a].getBoundingClientRect();
      const rb = E[r.b].getBoundingClientRect();
      const ca = [ra.left + ra.width / 2 - bb.left, ra.top + ra.height / 2 - bb.top];
      const cb = [rb.left + rb.width / 2 - bb.left, rb.top + rb.height / 2 - bb.top];
      const [x1, y1] = edge(ra, cb[0], cb[1]);
      const [x2, y2] = edge(rb, ca[0], ca[1]);
      const L = Math.hypot(x2 - x1, y2 - y1) || 1;
      const ux = (x2 - x1) / L;
      const uy = (y2 - y1) / L;
      const [ea, eb] = ends[r.card];
      const vis = !state.vis || state.vis.has('r' + i);
      const on = state.on && state.on.has('r' + i);
      const lab = (x, y, t) => `<g class="er-card"><circle cx="${x}" cy="${y}" r="10"/><text x="${x}" y="${y + 4}">${t}</text></g>`;
      return `<g class="rel ${vis ? '' : 'hide'} ${on ? 'on' : ''}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>${lab(x1 + ux * 16, y1 + uy * 16, ea)}${lab(x2 - ux * 16, y2 - uy * 16, eb)}${r.label ? `<text class="er-lab" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 7}">${esc(r.label)}</text>` : ''}</g>`;
    }).join('');
  };
  const onResize = () => { if (box.isConnected) draw(); };
  window.addEventListener('resize', onResize);
  if (!s.frames || !s.frames.length) {
    Object.values(E).forEach((x, i) => { x.style.setProperty('--d', i * 120 + 'ms'); x.classList.add('pop-in'); });
    requestAnimationFrame(draw);
    setTimeout(draw, 300);
    return;
  }
  const mentioned = new Set(s.frames.flatMap((f) => f.on || []));
  mkPlayer(b, s.frames.length, (i) => {
    const seen = new Set(s.frames.slice(0, i + 1).flatMap((f) => f.on || []));
    const vis = new Set([...Object.keys(E), ...s.rels.map((_, k) => 'r' + k)].filter((x) => !mentioned.has(x) || seen.has(x)));
    const on = new Set(s.frames[i].on || []);
    state = { vis, on };
    Object.entries(E).forEach(([k, x]) => { x.classList.toggle('hide', !vis.has(k)); x.classList.toggle('on', on.has(k)); });
    requestAnimationFrame(draw);
    setTimeout(draw, 350);
    return s.frames[i].text;
  }, { auto: true, interval: 2200 });
};

/* ── split: table → FDs → colored columns → decomposition ── */
SCR.split = (s, b) => {
  const t = s.table;
  const wrap = el('div', 'split');
  const fdBox = el('div', 'fds');
  const tb = el('div', 'sp-table');
  const parts = el('div', 'sp-parts');
  wrap.append(fdBox, tb, parts);
  b.append(wrap);
  const partOf = (ci) => {
    const nonKey = s.parts.findIndex((p) => p.cols.includes(ci) && !(p.pk || []).includes(ci));
    if (nonKey >= 0) return nonKey;
    return s.parts.findIndex((p) => p.cols.includes(ci));
  };
  const name = (ids) => ids.map((ci) => t.cols[ci]).join(', ');
  fdBox.innerHTML = (s.fds || []).map((fd, i) => `<span class="fd" data-i="${i}"><b>${esc(name(fd.from))}</b>${icon('arrow')}<b>${esc(name(fd.to))}</b></span>`).join('');
  const tableHTML = (cols, rows, pk, cls) => `<table class="sp ${cls}"><thead><tr>${cols.map((ci) => `<th data-ci="${ci}">${(pk || []).includes(ci) ? icon('key') : ''}${esc(t.cols[ci])}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((ci, j) => `<td data-ci="${ci}">${cellHTML(r[j])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const allCols = t.cols.map((_, i) => i);
  tb.innerHTML = `<div class="mini-h">${esc(t.name)} · ${t.rows.length} 行</div>` + tableHTML(allCols, t.rows, t.pk, 'big');
  parts.innerHTML = s.parts.map((p, pi) => {
    const seen = new Set();
    const rows = [];
    t.rows.forEach((r) => { const v = p.cols.map((ci) => r[ci]); const k = JSON.stringify(v); if (!seen.has(k)) { seen.add(k); rows.push(v); } });
    return `<div class="sp-part ${cat(pi)}" style="--d:${pi * 160}ms"><div class="sp-ph"><b>${esc(p.name)}</b><span>${t.rows.length} 行 → ${rows.length} 行</span></div>${tableHTML(p.cols, rows, p.pk, '')}</div>`;
  }).join('');
  mkPlayer(b, s.frames.length, (i) => {
    const f = s.frames[i];
    const st = f.stage;
    wrap.dataset.stage = st;
    $$('.fd', fdBox).forEach((x) => x.classList.toggle('on', st === 'fd' && (f.fd == null || +x.dataset.i === f.fd)));
    const fd = st === 'fd' && f.fd != null ? s.fds[f.fd] : null;
    $$('[data-ci]', tb).forEach((x) => {
      const ci = +x.dataset.ci;
      x.className = '';
      if (fd && fd.from.includes(ci)) x.classList.add('fd-from');
      if (fd && fd.to.includes(ci)) x.classList.add('fd-to');
      if (st === 'color' || st === 'split') { const p = partOf(ci); if (p >= 0) x.classList.add('pc', cat(p)); }
    });
    return f.text;
  }, { auto: true, interval: 2300 });
};

/* ── dom: CSS selector playground (what BeautifulSoup select() does) ── */
SCR.dom = (s, b, ctx) => {
  const doc = new DOMParser().parseFromString(s.html, 'text/html');
  const wrap = el('div', 'dom');
  const src = el('div', 'dom-src', '<div class="mini-h">HTML</div>' + codeBlock(s.html.trim(), 'html'));
  const treeBox = el('div', 'dom-tree', '<div class="mini-h">DOM 树</div>');
  const map = new Map();
  const node = (e, depth) => {
    const d = el('div', 'dn');
    const own = [...e.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join(' ').replace(/\s+/g, ' ').trim();
    const attrs = [...e.attributes].map((a) => ` <i>${esc(a.name)}</i>=<s>"${esc(a.value.length > 28 ? a.value.slice(0, 26) + '…' : a.value)}"</s>`).join('');
    d.innerHTML = `<div class="dn-t ${cat(depth)}"><span>&lt;${esc(e.tagName.toLowerCase())}${attrs}&gt;</span>${own ? `<em>${esc(own.length > 40 ? own.slice(0, 38) + '…' : own)}</em>` : ''}</div>`;
    map.set(e, d.firstChild);
    const kids = [...e.children];
    if (kids.length) { const k = el('div', 'dn-k'); kids.forEach((c) => k.append(node(c, depth + 1))); d.append(k); }
    return d;
  };
  [...doc.body.children].forEach((c) => treeBox.append(node(c, 0)));
  wrap.append(src, treeBox);
  const ctl = el('div', 'dom-ctl');
  ctl.innerHTML = `<label class="dom-in"><span class="mini-h">CSS 选择器</span><input type="text" spellcheck="false" autocomplete="off" id="dom-${uid++}" placeholder="例如 div.card h2"></label><div class="chips"></div>`;
  const inp = $('input', ctl);
  const chips = $('.chips', ctl);
  (s.presets || []).forEach((p) => chips.append(btn('chip-btn', esc(p), () => { inp.value = p; apply(); })));
  const res = el('div', 'dom-res');
  const tasks = el('div', 'dom-tasks');
  b.append(ctl, wrap, res, tasks);
  const done = new Set();
  (s.tasks || []).forEach((tk, i) => tasks.append(el('div', 'dom-task', `<span class="dt-n">${i + 1}</span><span>${tk.q}</span><i>${icon('check')}</i>`)));
  function apply() {
    const sel = inp.value.trim();
    map.forEach((x) => x.classList.remove('hit'));
    if (!sel) { res.innerHTML = '<span class="muted">输入选择器，或点上面的例子。</span>'; return; }
    let found;
    try { found = [...doc.body.querySelectorAll(sel)]; } catch (e) { res.innerHTML = '<span class="badc">选择器写法有误。</span>'; return; }
    found.forEach((e) => map.get(e) && map.get(e).classList.add('hit'));
    const py = s.py ? `<div class="dom-py">${codeBlock(s.py.replace('{sel}', sel), 'py')}</div>` : '';
    res.innerHTML = `<div class="dom-n"><b>${found.length}</b> 个元素匹配</div>${py}<div class="dom-texts">${found.slice(0, 12).map((e) => `<span>${esc(e.textContent.replace(/\s+/g, ' ').trim().slice(0, 60) || '（空）')}</span>`).join('')}</div>`;
    (s.tasks || []).forEach((tk, i) => {
      if (done.has(i)) return;
      let want = [];
      try { want = [...doc.body.querySelectorAll(tk.sel)]; } catch (e) { return; }
      if (want.length === found.length && want.every((w) => found.includes(w))) {
        done.add(i);
        tasks.children[i].classList.add('ok');
        Sound.play('ok');
        toast(`任务 ${i + 1} 完成`, 'ok');
      }
    });
  }
  inp.addEventListener('input', apply);
  inp.addEventListener('keydown', (e) => e.stopPropagation());
  if (s.presets && s.presets.length && !(s.tasks || []).length) { inp.value = s.presets[0]; }
  apply();
};

/* ── chart: SVG line / bar / scatter / hist ── */
SCR.chart = (s, b) => {
  const W = 560;
  const H = 300;
  const m = { l: 52, r: 16, t: 18, b: 46 };
  let series = s.series;
  let xs = s.x;
  if (s.kind === 'hist') {
    const v = s.series[0].y;
    const lo = Math.min(...v);
    const hi = Math.max(...v);
    const nb = Math.min(12, Math.max(5, Math.ceil(Math.sqrt(v.length))));
    const w = (hi - lo) / nb || 1;
    const counts = Array(nb).fill(0);
    v.forEach((x) => { counts[Math.min(nb - 1, Math.floor((x - lo) / w))]++; });
    xs = counts.map((_, i) => +(lo + w * (i + 0.5)).toFixed(2));
    series = [{ name: s.series[0].name, y: counts }];
  }
  const n = Math.max(...series.map((se) => se.y.length));
  xs = xs || Array.from({ length: n }, (_, i) => i);
  const numericX = xs.every((x) => typeof x === 'number') && s.kind !== 'bar' && s.kind !== 'hist';
  const allY = series.flatMap((se) => se.y);
  let y0 = Math.min(0, ...allY);
  let y1 = Math.max(...allY);
  if (s.kind === 'scatter' || s.kind === 'line') { const pad = (y1 - Math.min(...allY)) * 0.08 || 1; y0 = Math.min(...allY) >= 0 && Math.min(...allY) < (y1 - Math.min(...allY)) ? 0 : Math.min(...allY) - pad; y1 += pad; }
  const step = niceStep((y1 - y0) / 5);
  y0 = Math.floor(y0 / step) * step;
  y1 = Math.ceil(y1 / step) * step;
  const Y = (v) => m.t + (H - m.t - m.b) * (1 - (v - y0) / (y1 - y0 || 1));
  const x0 = numericX ? Math.min(...xs) : 0;
  const x1 = numericX ? Math.max(...xs) : xs.length;
  const X = numericX ? (v) => m.l + (W - m.l - m.r) * ((v - x0) / (x1 - x0 || 1)) : (i) => m.l + (W - m.l - m.r) * ((i + 0.5) / xs.length);
  let g = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(6)}</text>`;
  const every = Math.ceil(xs.length / 10);
  xs.forEach((x, i) => { if (i % every === 0 || i === xs.length - 1) g += `<text class="tick" x="${numericX ? X(x) : X(i)}" y="${H - m.b + 18}" text-anchor="middle">${esc(String(x))}</text>`; });
  const bw = (W - m.l - m.r) / xs.length / Math.max(1, series.length) * 0.8;
  let marks = '';
  series.forEach((se, si) => {
    const c = cat(si);
    if (s.kind === 'line') {
      const d = se.y.map((v, i) => `${i ? 'L' : 'M'}${numericX ? X(xs[i]) : X(i)} ${Y(v)}`).join(' ');
      marks += `<path class="ln-s ${c}" d="${d}" pathLength="1"/>`;
      se.y.forEach((v, i) => { marks += `<circle class="dot ${c}" style="--d:${i * 40}ms" cx="${numericX ? X(xs[i]) : X(i)}" cy="${Y(v)}" r="3"/>`; });
    } else if (s.kind === 'scatter') {
      se.y.forEach((v, i) => { marks += `<circle class="dot sc ${c}" style="--d:${i * 25}ms" cx="${numericX ? X(xs[i]) : X(i)}" cy="${Y(v)}" r="4.5"/>`; });
    } else {
      se.y.forEach((v, i) => {
        const cx = X(i) - (bw * series.length) / 2 + bw * si;
        const top = Y(Math.max(v, 0));
        const h = Math.abs(Y(v) - Y(0));
        marks += `<rect class="bar ${c}" style="--d:${i * 50}ms" x="${cx}" y="${top}" width="${s.kind === 'hist' ? (W - m.l - m.r) / xs.length - 2 : bw - 2}" height="${h}" rx="2"/>`;
      });
    }
  });
  if (s.kind === 'hist') marks = marks.replace(/x="([\d.]+)"/g, (mm, v) => `x="${+v - ((W - m.l - m.r) / xs.length - 2) / 2 + bw / 2}"`);
  const legend = series.length > 1 ? `<div class="legend">${series.map((se, i) => `<span class="${cat(i)}"><i></i>${esc(se.name || '')}</span>`).join('')}</div>` : '';
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.title || 'chart')}"><g>${g}</g><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${Y(Math.max(y0, 0))}" y2="${Y(Math.max(y0, 0))}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/>${marks}${s.xlabel ? `<text class="alab" x="${(W + m.l) / 2}" y="${H - 6}" text-anchor="middle">${esc(s.xlabel)}</text>` : ''}${s.ylabel ? `<text class="alab" transform="translate(13 ${(H - m.b + m.t) / 2}) rotate(-90)" text-anchor="middle">${esc(s.ylabel)}</text>` : ''}</svg>`;
  const wrap = el('div', 'chart-wrap' + (s.code ? ' with-code' : ''));
  wrap.innerHTML = (s.code ? `<div>${codeBlock(s.code, s.lang || 'py')}</div>` : '') + `<div class="chart-box">${legend}${svg}<button type="button" class="pl-b replay" aria-label="重新播放">${icon('undo')}</button></div>`;
  b.append(wrap);
  $('.replay', wrap).onclick = () => { const x = $('.chart', wrap); x.replaceWith(x.cloneNode(true)); };
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  }
};

/* ── code: annotated walk-through ── */
SCR.code = (s, b) => {
  const pre = el('pre', 'code lines');
  pre.innerHTML = codeLines(s.code, s.lang || 'py');
  b.append(pre);
  mkPlayer(b, s.notes.length, (i) => {
    const nt = s.notes[i];
    const ls = nt.lines ? (nt.lines.length === 2 && nt.lines[1] > nt.lines[0] + 1 ? Array.from({ length: nt.lines[1] - nt.lines[0] + 1 }, (_, k) => nt.lines[0] + k) : nt.lines) : [nt.line];
    $$('.ln', pre).forEach((l, j) => l.classList.toggle('on', ls.includes(j)));
    const first = $$('.ln', pre)[ls[0]];
    if (first && pre.scrollHeight > pre.clientHeight) pre.scrollTo({ top: first.offsetTop - 40, behavior: REDUCED ? 'auto' : 'smooth' });
    return nt.text;
  }, { interval: 3200 });
};

/* ── interactive: choice ── */
function choiceScreen(s, b, ctx) {
  if (s.t === 'predict') {
    b.insertAdjacentHTML('beforeend', codeBlock(s.code, s.lang || 'sql', 'big'));
    b.insertAdjacentHTML('beforeend', `<div class="q">${s.q || '运行结果是？'}</div>`);
  } else {
    b.insertAdjacentHTML('beforeend', `<div class="q">${s.q}</div>`);
    if (s.code) b.insertAdjacentHTML('beforeend', codeBlock(s.code, s.lang || 'sql'));
  }
  if (s.table) b.insertAdjacentHTML('beforeend', staticTable(s.table.head, s.table.rows, 'mini'));
  const opts = el('div', 'opts' + (s.opts.every((o) => o.length <= 14) ? ' short' : ''));
  const why = el('div', 'why');
  why.hidden = true;
  let answered = false;
  s.opts.forEach((o, i) => {
    const bt = btn('opt ' + cat(i), `<span class="opt-k">${'ABCDE'[i]}</span><span class="opt-t">${esc(o)}</span>`, () => {
      if (answered) return;
      answered = true;
      const ok = i === s.a;
      bt.classList.add(ok ? 'right' : 'wrong');
      opts.children[s.a].classList.add('right');
      [...opts.children].forEach((x) => (x.disabled = true));
      why.hidden = false;
      why.className = 'why ' + (ok ? 'ok' : 'bad');
      why.innerHTML = `<b>${ok ? '答对了' : '不对'}</b> ${s.why || ''}`;
      Sound.play(ok ? 'ok' : 'bad');
      if (!ok) opts.classList.add('shake');
      ctx.done(ok);
      if (s.run && ctx.seed) {
        const out = el('div', 'live');
        out.innerHTML = '<div class="mini-h">在数据库里真的跑一遍</div>';
        b.append(out);
        withDB(out, () => { const db = freshDB(ctx.seed); out.insertAdjacentHTML('beforeend', resultHTML(runSQL(db, s.code))); db.close(); });
      }
    });
    opts.append(bt);
  });
  b.append(opts, why);
}
SCR.quiz = choiceScreen;
SCR.predict = choiceScreen;

SCR.fill = (s, b, ctx) => {
  b.insertAdjacentHTML('beforeend', `<div class="q">${s.q}</div>`);
  const pieces = s.tpl.split(/\{(\d)\}/);
  const pre = el('pre', 'code fill');
  const code = el('code');
  const inputs = [];
  pieces.forEach((p, i) => {
    if (i % 2 === 0) { code.insertAdjacentHTML('beforeend', hlAny(p, s.lang || 'sql')); return; }
    const bl = s.blanks[+p];
    const inp = el('input', 'blank');
    inp.type = 'text';
    inp.id = 'fill-' + uid++;
    inp.spellcheck = false;
    inp.autocomplete = 'off';
    inp.setAttribute('autocapitalize', 'off');
    inp.setAttribute('aria-label', `第 ${+p + 1} 个空`);
    inp.style.width = Math.max(4, Math.max(...bl.a.map((x) => x.length)) + 2) + 'ch';
    inp.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); check(); } });
    inputs[+p] = inp;
    code.append(inp);
  });
  pre.append(code);
  const row = el('div', 'btnrow');
  const cb = btn('btn primary', '检查', () => check());
  const sb = btn('btn ghost', '看答案', () => {
    inputs.forEach((inp, i) => { inp.value = s.blanks[i].a[0]; inp.className = 'blank ok'; });
    finish(false, '<b>答案已填入。</b> ' + s.why);
  });
  sb.hidden = true;
  row.append(cb, sb);
  const why = el('div', 'why');
  why.hidden = true;
  b.append(pre, row, why);
  let tries = 0;
  let over = false;
  const norm = (x) => x.trim().replace(/\s+/g, ' ');
  function finish(ok, html) {
    over = true;
    cb.disabled = true;
    sb.hidden = true;
    inputs.forEach((x) => (x.readOnly = true));
    why.hidden = false;
    why.className = 'why ' + (ok ? 'ok' : 'bad');
    why.innerHTML = html;
    ctx.done(ok && tries === 1);
  }
  function check() {
    if (over) return;
    tries++;
    let all = true;
    inputs.forEach((inp, i) => {
      const bl = s.blanks[i];
      const v = norm(inp.value);
      const ok = bl.a.some((a) => (bl.cs ? v === norm(a) : v.toUpperCase() === norm(a).toUpperCase()));
      inp.className = 'blank ' + (ok ? 'ok' : 'bad');
      if (!ok) all = false;
    });
    if (all) { Sound.play('ok'); finish(true, `<b>答对了</b> ${s.why}`); return; }
    Sound.play('bad');
    pre.classList.remove('shake'); void pre.offsetWidth; pre.classList.add('shake');
    why.hidden = false;
    why.className = 'why bad';
    why.innerHTML = `<b>还不对</b> 红框的空再想想。${tries >= 2 ? '也可以看答案。' : ''}`;
    if (tries >= 2) sb.hidden = false;
  }
};

SCR.order = (s, b, ctx) => {
  b.insertAdjacentHTML('beforeend', `<div class="q">${s.q}</div>`);
  const ans = el('div', 'ord-ans');
  const pool = el('div', 'ord-pool');
  b.append(el('div', 'mini-h', '你的顺序（点下面的块加入，点已加入的块撤回）'), ans, el('div', 'mini-h', '可选的块'), pool);
  let order = shuffle(s.parts.map((_, i) => i));
  if (order.every((v, i) => v === i)) order = order.reverse();
  const picked = [];
  const row = el('div', 'btnrow');
  const cb = btn('btn primary', '检查');
  const rb = btn('btn ghost', '清空');
  const sb = btn('btn ghost', '看答案');
  sb.hidden = true;
  row.append(cb, rb, sb);
  const why = el('div', 'why');
  why.hidden = true;
  b.append(row, why);
  const els = s.parts.map((p, i) => btn('blk ' + cat(i), `<span class="blk-n"></span><span>${hlAny(p, s.lang || 'sql')}</span>`, () => {
    if (over) return;
    const k = picked.indexOf(i);
    if (k >= 0) picked.splice(k, 1); else picked.push(i);
    Sound.play('tap');
    draw();
  }));
  let tries = 0;
  let over = false;
  const draw = () => {
    const play = flip(els);
    picked.forEach((pi, k) => { els[pi].querySelector('.blk-n').textContent = k + 1; ans.append(els[pi]); });
    order.filter((pi) => !picked.includes(pi)).forEach((pi) => { els[pi].querySelector('.blk-n').textContent = ''; pool.append(els[pi]); });
    ans.classList.toggle('empty', !picked.length);
    cb.disabled = picked.length !== s.parts.length || over;
    play();
  };
  draw();
  const finish = (ok, html) => { over = true; cb.disabled = true; rb.disabled = true; sb.hidden = true; why.hidden = false; why.className = 'why ' + (ok ? 'ok' : 'bad'); why.innerHTML = html; ctx.done(ok && tries === 1); };
  cb.onclick = () => {
    tries++;
    const ok = picked.every((pi, k) => pi === k);
    els.forEach((e) => e.classList.remove('ok', 'bad'));
    picked.forEach((pi, k) => els[pi].classList.add(pi === k ? 'ok' : 'bad'));
    if (ok) { Sound.play('ok'); finish(true, `<b>答对了</b> ${s.why}`); return; }
    Sound.play('bad');
    const k = picked.findIndex((pi, kk) => pi !== kk);
    why.hidden = false;
    why.className = 'why bad';
    why.innerHTML = `<b>顺序不对</b> 从第 ${k + 1} 块开始出错。点「清空」再试。${tries >= 2 ? '或者看答案。' : ''}`;
    if (tries >= 2) sb.hidden = false;
  };
  rb.onclick = () => { if (over) return; picked.length = 0; why.hidden = true; els.forEach((e) => e.classList.remove('ok', 'bad')); draw(); };
  sb.onclick = () => { picked.length = 0; s.parts.forEach((_, i) => picked.push(i)); draw(); els.forEach((e) => e.classList.add('ok')); finish(false, `<b>正确顺序如上。</b> ${s.why}`); };
};

SCR.sort = (s, b, ctx) => {
  b.insertAdjacentHTML('beforeend', `<div class="q">${s.q}</div><div class="muted small">点一个卡片，再点它该去的格子（电脑上也可以直接拖）。</div>`);
  const pool = el('div', 'sort-pool');
  const bks = el('div', 'sort-buckets');
  bks.style.setProperty('--n', Math.min(s.buckets.length, 4));
  const zones = s.buckets.map((name, i) => {
    const z = el('div', 'sort-bk ' + cat(i), `<div class="sort-bh">${esc(name)}</div><div class="sort-bb"></div>`);
    z.onclick = (e) => { if (e.target.closest('.sort-it')) return; drop(i); };
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('over'); const k = +e.dataTransfer.getData('text/plain'); sel = k; drop(i); });
    bks.append(z);
    return z;
  });
  pool.onclick = (e) => { if (!e.target.closest('.sort-it') && sel != null) drop(null); };
  const order = shuffle(s.items.map((_, i) => i));
  const place = new Map();
  let sel = null;
  let over = false;
  const items = s.items.map(([txt], i) => {
    const it = btn('sort-it', esc(txt), () => {
      if (over) return;
      sel = sel === i ? null : i;
      items.forEach((x, k) => x.classList.toggle('sel', k === sel));
      Sound.play('tap');
    });
    it.draggable = true;
    it.addEventListener('dragstart', (e) => { if (over) return e.preventDefault(); e.dataTransfer.setData('text/plain', String(i)); });
    return it;
  });
  order.forEach((i) => pool.append(items[i]));
  const row = el('div', 'btnrow');
  const cb = btn('btn primary', '检查', () => check());
  cb.disabled = true;
  row.append(cb);
  const why = el('div', 'why');
  why.hidden = true;
  b.append(pool, bks, row, why);
  function drop(bi) {
    if (sel == null || over) return;
    const play = flip(items);
    if (bi == null) { place.delete(sel); pool.append(items[sel]); } else { place.set(sel, bi); zones[bi].querySelector('.sort-bb').append(items[sel]); }
    items[sel].classList.remove('sel');
    sel = null;
    play();
    cb.disabled = place.size !== s.items.length;
    pool.classList.toggle('empty', place.size === s.items.length);
  }
  function check() {
    over = true;
    cb.disabled = true;
    let ok = 0;
    s.items.forEach(([, want], i) => {
      const good = place.get(i) === want;
      if (good) ok++;
      items[i].classList.add(good ? 'ok' : 'bad');
      if (!good) items[i].insertAdjacentHTML('beforeend', `<em>→ ${esc(s.buckets[want])}</em>`);
      items[i].draggable = false;
    });
    const all = ok === s.items.length;
    Sound.play(all ? 'ok' : 'bad');
    why.hidden = false;
    why.className = 'why ' + (all ? 'ok' : 'bad');
    why.innerHTML = `<b>${all ? '全部分对了' : `分对 ${ok} / ${s.items.length}`}</b> ${s.why || ''}`;
    ctx.done(all);
  }
};

SCR.match = (s, b, ctx) => {
  b.insertAdjacentHTML('beforeend', `<div class="q">${s.q}</div><div class="muted small">先点左边，再点右边和它对应的那一个。</div>`);
  const grid = el('div', 'match');
  const L = el('div', 'm-col');
  const R = el('div', 'm-col');
  grid.append(L, R);
  const why = el('div', 'why');
  why.hidden = true;
  b.append(grid, why);
  let selL = null;
  let selR = null;
  let mistakes = 0;
  let matched = 0;
  const le = shuffle(s.pairs.map((_, i) => i)).map((i) => { const x = btn('m-it', esc(s.pairs[i][0]), () => pick('L', i, x)); x.dataset.i = i; L.append(x); return x; });
  const re = shuffle(s.pairs.map((_, i) => i)).map((i) => { const x = btn('m-it', esc(s.pairs[i][1]), () => pick('R', i, x)); x.dataset.i = i; R.append(x); return x; });
  function pick(side, i, x) {
    if (x.classList.contains('done')) return;
    if (side === 'L') { selL = selL && selL.x === x ? null : { i, x }; } else { selR = selR && selR.x === x ? null : { i, x }; }
    le.concat(re).forEach((y) => y.classList.remove('sel'));
    if (selL) selL.x.classList.add('sel');
    if (selR) selR.x.classList.add('sel');
    if (selL && selR) {
      if (selL.i === selR.i) {
        const c = cat(matched);
        selL.x.classList.add('done', c);
        selR.x.classList.add('done', c);
        selL.x.disabled = selR.x.disabled = true;
        matched++;
        Sound.play('ok');
      } else {
        mistakes++;
        const a = selL.x;
        const z = selR.x;
        [a, z].forEach((y) => { y.classList.remove('shake'); void y.offsetWidth; y.classList.add('shake', 'no'); setTimeout(() => y.classList.remove('no'), 500); });
        Sound.play('bad');
      }
      le.concat(re).forEach((y) => y.classList.remove('sel'));
      selL = selR = null;
      if (matched === s.pairs.length) {
        why.hidden = false;
        why.className = 'why ' + (mistakes ? 'bad' : 'ok');
        why.innerHTML = `<b>${mistakes ? `全部连上了（错了 ${mistakes} 次）` : '一次全对'}</b> ${s.why || ''}`;
        ctx.done(mistakes === 0);
      }
    }
  }
};

SCR.sql = (s, b, ctx) => {
  b.insertAdjacentHTML('beforeend', `<div class="q">${s.task}</div>`);
  const out = el('div', 'run-out');
  const fb = el('div', 'fb');
  let tries = 0;
  let solved = false;
  const run = () => withDB(out, () => {
    const db = freshDB(ctx.seed);
    const res = runSQL(db, ed.value);
    out.innerHTML = resultHTML(res);
    out.classList.remove('pop'); void out.offsetWidth; out.classList.add('pop');
    if (s.check && !res.error) {
      const rdb = freshDB(ctx.seed);
      const ref = runSQL(rdb, s.check);
      rdb.close();
      tries++;
      const c = compareSets(res.sets[res.sets.length - 1], ref.sets && ref.sets[ref.sets.length - 1], s.ordered);
      fb.className = 'fb ' + (c.ok ? 'good' : 'bad');
      fb.innerHTML = c.ok ? '<b>通过！</b> 结果和期望完全一致。' : `<b>还不对</b> ${c.msg}${s.hint && tries >= 1 ? `<div class="hint">提示：${s.hint}</div>` : ''}`;
      if (!c.ok && tries >= 2) sol.hidden = false;
      Sound.play(c.ok ? 'ok' : 'bad');
      if (c.ok && !solved) { solved = true; ctx.done(tries === 1); }
    } else if (res.error) {
      tries++;
      fb.className = 'fb bad';
      fb.innerHTML = s.check ? '<b>SQL 报错</b> 看下面的说明。' : '<b>报错了</b>（有时候这正是要看的效果），读一读下面的说明。';
      if (s.check && tries >= 2) sol.hidden = false;
      if (!s.check && !solved) { solved = true; ctx.done(true); }
    } else if (!s.check && !solved) { solved = true; fb.className = 'fb good'; fb.innerHTML = '<b>跑通了。</b> 改一改再试试。'; ctx.done(true); }
    db.close();
  });
  const ed = mkEditor(s.sql || '', { onRun: run });
  const row = el('div', 'btnrow');
  row.append(btn('btn primary', `${icon('play')} 运行 <kbd>Ctrl ↵</kbd>`, run), btn('btn ghost', '还原', () => { ed.value = s.sql || ''; }));
  const sol = btn('btn ghost', '看答案', () => { ans.hidden = false; sol.hidden = true; if (!solved) { solved = true; ctx.done(false); } });
  sol.hidden = true;
  row.append(sol);
  const ans = el('div', 'solbox', `<div class="mini-h">参考写法</div>${codeBlock(s.check || '')}`);
  ans.hidden = true;
  b.append(ed.wrap, row, fb, ans, out);
};

  },
  cardsNew(chId) { return CHS().filter((c) => !chId || chId === 'all' || c.id === chId).reduce((a, c) => a + c.cards.filter((_, i) => !chs(c.id).cards['k' + i]).length, 0); },
  open() { return Object.values(S.mistakes).filter((m) => !m.fixed && CH(m.ch)).length; },
};

function nextLesson() {
  if (S.last && CH(S.last.ch)) {
    const ch = CH(S.last.ch);
    const l = ch.lessons.find((x) => x.id === S.last.les);
    if (l && !chs(ch.id).les[l.id]?.done) return { ch, l };
    const nx = ch.lessons.find((x) => !chs(ch.id).les[x.id]?.done);
    if (nx) return { ch, l: nx };
  }
  for (const ch of CHS()) { const l = ch.lessons.find((x) => !chs(ch.id).les[x.id]?.done); if (l) return { ch, l }; }
  const c = CHS()[0];
  return c ? { ch: c, l: c.lessons[0] } : null;
}

function schemaText(seed) {
  if (!seed || !SQLLIB) return '（无）';
  try {
    const db = vizDB(seed);
    const lines = [];
    q1(db, "SELECT name FROM sqlite_master WHERE type='table'").forEach((r) => lines.push(`${r.name}(${q1(db, `PRAGMA table_info("${r.name}")`).map((c) => c.name).join(', ')})`));
    q1(db, 'PRAGMA database_list').filter((d) => d.name !== 'main' && d.name !== 'temp').forEach((d) => q1(db, `SELECT name FROM "${d.name}".sqlite_master WHERE type='table'`).forEach((r) => lines.push(`${d.name}.${r.name}(${q1(db, `PRAGMA "${d.name}".table_info("${r.name}")`).map((c) => c.name).join(', ')})`)));
    return lines.join('\n');
  } catch (e) { return '（无）'; }
}

      const ex = (ch.practice || []).find((e) => e.id === ui.ex);
      const mine = ex ? chs(ch.id).prac[ex.id]?.sql || '' : '';
      return `第 ${ch.no} 章 SQL 实战${ex ? `，题目 ${ex.id}《${ex.title}》：${strip(ex.prompt)}\n学生当前的 SQL：\n${mine.slice(0, 1500)}` : '（沙盒）'}\n数据库：\n${schemaText(ch.db)}`;
    }
    if (ui.view === 'chapter' && CH(ui.ch)) { const ch = CH(ui.ch); return `第 ${ch.no} 章《${ch.title}》：${ch.blurb || ''}。小课：${ch.lessons.map((l) => l.title).join('、')}`; }
    return 'CSE 3104 复习（全部章节）。';
  },
  label() {
    if (Runner.current && ['lesson', 'boss', 'mix'].includes(ui.view)) return `当前：${Runner.current.R.title}`;
    if (CH(ui.ch) && ['chapter', 'practice'].includes(ui.view)) return `当前：第 ${CH(ui.ch).no} 章`;
    return '当前：复习';
  },
  open() {
    const d = $('#tutor');
    d.hidden = false;
    requestAnimationFrame(() => d.classList.add('open'));
    $('#tutor-ctx').textContent = this.label();
    if (!this.turns.length) this.suggest();
    $('#tutor-in').focus();
  },
  close() {
    const d = $('#tutor');
    d.classList.remove('open');
    setTimeout(() => (d.hidden = true), 250);
  },
  suggest() {
    const log = $('#tutor-log');
    const qs = ui.view === 'practice' ? ['我这条 SQL 哪里不对？给提示，别直接给答案', '这道题应该用什么思路？'] : ['这一屏我没看懂，换个例子讲一遍', '出 2 道题考我这个知识点', '口试会怎么问这个？给我一个英文回答范例'];
    log.innerHTML = '<div class="tmsg sys">我是本课的助教。可以问概念、问报错，也可以让我出题考你。</div>';
    const sg = el('div', 'chips');
    qs.forEach((q) => sg.append(btn('chip-btn', esc(q), () => this.ask(q))));
    log.append(sg);
  },
  async ask(text) {
    if (!text.trim() || !AI.ok) return;
    const log = $('#tutor-log');
    log.append(el('div', 'tmsg me', esc(text)));
    const bub = el('div', 'tmsg ai muted', '思考中…');
    log.append(bub);
    log.scrollTop = log.scrollHeight;
    this.turns.push({ role: 'user', content: `【当前位置】${this.context()}\n\n【问题】${text}` });
    if (this.turns.length > 12) this.turns = this.turns.slice(-12);
    if (this.turns[0].role !== 'user') this.turns.shift();
    this.ctl = new AbortController();
    $('#tutor-stop').hidden = false;
    try {
      const { text: ans } = await AI.fn([{ role: 'user', content: this.rules() }, ...this.turns], {
        cache: false, signal: this.ctl.signal,
        onText: ({ text: t }) => { bub.classList.remove('muted'); bub.innerHTML = md(t); log.scrollTop = log.scrollHeight; },
      });
      bub.innerHTML = md(ans);
      this.turns.push({ role: 'assistant', content: ans });
    } catch (e) {
      const msg = AI.errText(e);
      if (e && e.text) { bub.innerHTML = md(e.text); this.turns.push({ role: 'assistant', content: e.text }); } else bub.textContent = msg || '已停止。';
      bub.classList.remove('muted');
    } finally {
      $('#tutor-stop').hidden = true;
      this.ctl = null;
    }
  },
  init() {
    $('#tutor-x').onclick = () => this.close();
    $('#tutor-stop').onclick = () => this.ctl && this.ctl.abort();
    $('#tutor-f').addEventListener('submit', (e) => { e.preventDefault(); const i = $('#tutor-in'); const v = i.value; i.value = ''; this.ask(v); });
    $('#tutor-in').addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#tutor-f').requestSubmit(); } });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#tutor').hidden) this.close(); });
  },
};

/* ───────── boot ───────── */
function boot() {
  const h = (location.hash || '').slice(1);
  if (/^c\d\d$/.test(h) && CH(h)) Object.assign(ui, { view: 'chapter', ch: h });
  else if (h === 'review') ui.view = 'review';
  else if (h === 'home') ui.view = 'home';
  if (ui.view === 'lesson' && !(CH(ui.ch) && CH(ui.ch).lessons.find((l) => l.id === ui.les))) ui.view = 'home';
  renderHeader();
  render();
  Tutor.init();
  cloud.onLoad = () => render();
  cloud.init();
  AI.init();
  const setH = () => document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px');
  setH();
  window.addEventListener('resize', setH);
}
boot();

})();
</script>
