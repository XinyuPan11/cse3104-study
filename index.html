<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>CSE 3104 学习站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a course map of 12 colored chapter tiles; each chapter re-tints the whole page (--h); lessons are a stack of single-idea screen cards with a sticky step bar. Category colors (.cat0–5) give every demo its own palette. */
:root {
  --h: 250;
  --bg: oklch(97.6% 0.008 var(--h));
  --surface: oklch(100% 0 0);
  --surface-2: oklch(95.6% 0.013 var(--h));
  --ink: oklch(23% 0.025 var(--h));
  --muted: oklch(50% 0.025 var(--h));
  --line: oklch(90.5% 0.016 var(--h));
  --c: oklch(55% 0.17 var(--h));
  --c-ink: oklch(100% 0 0);
  --c-soft: oklch(94% 0.045 var(--h));
  --c-strong: oklch(44% 0.15 var(--h));
  --Ls: 94.5%; --Cs: 0.05; --Lm: 72%; --Cm: 0.15; --Lk: 47%; --Ck: 0.16;
  --ok: oklch(55% 0.14 155); --ok-soft: oklch(94% 0.05 155);
  --bad: oklch(57% 0.19 27); --bad-soft: oklch(94.5% 0.035 27);
  --warn: oklch(60% 0.14 70); --warn-soft: oklch(95% 0.06 85);
  --null: oklch(52% 0.16 300); --null-soft: oklch(94.5% 0.04 300);
  --gold: oklch(80% 0.16 85);
  --code-bg: oklch(97.4% 0.01 var(--h));
  --tk: oklch(50% 0.18 262); --ts: oklch(52% 0.14 50); --tn: oklch(52% 0.12 175); --tc: oklch(60% 0.02 250); --tf: oklch(50% 0.18 315);
  --shadow: 0 1px 2px oklch(30% 0.03 var(--h) / .07), 0 8px 28px oklch(30% 0.05 var(--h) / .08);
  --display: "Archivo", "Noto Sans SC", system-ui, sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --hdr: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(17% 0.016 var(--h)); --surface: oklch(21.5% 0.02 var(--h)); --surface-2: oklch(26% 0.022 var(--h));
    --ink: oklch(94% 0.012 var(--h)); --muted: oklch(73% 0.022 var(--h)); --line: oklch(32% 0.022 var(--h));
    --c: oklch(74% 0.14 var(--h)); --c-ink: oklch(18% 0.03 var(--h)); --c-soft: oklch(31% 0.07 var(--h)); --c-strong: oklch(84% 0.11 var(--h));
    --Ls: 30%; --Cs: 0.07; --Lm: 66%; --Cm: 0.14; --Lk: 82%; --Ck: 0.12;
    --ok: oklch(75% 0.15 155); --ok-soft: oklch(32% 0.06 155); --bad: oklch(72% 0.16 27); --bad-soft: oklch(31% 0.06 27);
    --warn: oklch(80% 0.13 75); --warn-soft: oklch(32% 0.06 75); --null: oklch(76% 0.12 300); --null-soft: oklch(31% 0.06 300);
    --code-bg: oklch(19% 0.018 var(--h));
    --tk: oklch(78% 0.13 262); --ts: oklch(78% 0.12 55); --tn: oklch(80% 0.11 175); --tc: oklch(62% 0.02 250); --tf: oklch(78% 0.13 315);
    --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 10px 30px oklch(0% 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(17% 0.016 var(--h)); --surface: oklch(21.5% 0.02 var(--h)); --surface-2: oklch(26% 0.022 var(--h));
  --ink: oklch(94% 0.012 var(--h)); --muted: oklch(73% 0.022 var(--h)); --line: oklch(32% 0.022 var(--h));
  --c: oklch(74% 0.14 var(--h)); --c-ink: oklch(18% 0.03 var(--h)); --c-soft: oklch(31% 0.07 var(--h)); --c-strong: oklch(84% 0.11 var(--h));
  --Ls: 30%; --Cs: 0.07; --Lm: 66%; --Cm: 0.14; --Lk: 82%; --Ck: 0.12;
  --ok: oklch(75% 0.15 155); --ok-soft: oklch(32% 0.06 155); --bad: oklch(72% 0.16 27); --bad-soft: oklch(31% 0.06 27);
  --warn: oklch(80% 0.13 75); --warn-soft: oklch(32% 0.06 75); --null: oklch(76% 0.12 300); --null-soft: oklch(31% 0.06 300);
  --code-bg: oklch(19% 0.018 var(--h));
  --tk: oklch(78% 0.13 262); --ts: oklch(78% 0.12 55); --tn: oklch(80% 0.11 175); --tc: oklch(62% 0.02 250); --tf: oklch(78% 0.13 315);
  --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 10px 30px oklch(0% 0 0 / .35);
  color-scheme: dark;
}
.cat0 { --k: 255; } .cat1 { --k: 155; } .cat2 { --k: 70; } .cat3 { --k: 340; } .cat4 { --k: 205; } .cat5 { --k: 28; }
[class*="cat"] { --k-soft: oklch(var(--Ls) var(--Cs) var(--k)); --k-mid: oklch(var(--Lm) var(--Cm) var(--k)); --k-strong: oklch(var(--Lk) var(--Ck) var(--k)); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hdr) + 12px); }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.7; transition: background-color .5s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--c-strong); }
code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
kbd { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 2px; }
mark { background: linear-gradient(transparent 55%, oklch(var(--Ls) 0.09 var(--h)) 55%); color: inherit; padding: 0 2px; }
b, strong { font-weight: 700; }
h1, h2, h3 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow, .mini-h { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mini-h { display: block; margin: 12px 0 6px; }
:focus-visible { outline: 2.5px solid var(--c); outline-offset: 2px; }
.ico { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }

/* buttons */
.btn { font: 600 14px/1.2 var(--body); padding: 9px 15px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: background .15s, border-color .15s, transform .12s, box-shadow .15s; }
.btn:hover:not(:disabled) { border-color: var(--c); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--c); color: var(--c-ink); border-color: transparent; box-shadow: 0 4px 14px oklch(55% 0.17 var(--h) / .25); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.big { padding: 13px 22px; font-size: 16px; border-radius: 12px; }
.btn.nudge { animation: nudge 1.2s ease 2; }
@keyframes nudge { 30% { transform: translateX(4px); } 60% { transform: translateX(-2px); } }
.link { background: none; border: 0; color: var(--muted); font: 13px var(--body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.icon-b { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.icon-b:hover { border-color: var(--c); }
.icon-b .ico { width: 19px; height: 19px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.ai-only { display: none !important; }
.has-ai .ai-only { display: inline-flex !important; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; vertical-align: middle; display: inline-flex; gap: 4px; align-items: center; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.tag { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--c-soft); color: var(--c-strong); white-space: nowrap; }
.okc { color: var(--ok); }
.badc { color: var(--bad); }
.null { color: var(--null); font-style: italic; font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.badge-n { font: 700 11px var(--mono); background: var(--bad); color: oklch(100% 0 0); padding: 1px 6px; border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { font: 600 13px var(--mono); padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: all .15s; }
.chip-btn:hover { border-color: var(--c); }
.chip-btn.on { background: var(--c); color: var(--c-ink); border-color: var(--c); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklch, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 10px 14px; padding-block: 9px; }
.brand { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; }
.brand-c { font-family: var(--display); font-stretch: 118%; font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.brand-s { font-size: 13px; color: var(--muted); }
.topnav { display: flex; gap: 4px; }
.topnav button { display: flex; gap: 6px; align-items: center; background: none; border: 0; padding: 7px 12px; border-radius: 9px; color: var(--muted); font: 600 14px var(--body); cursor: pointer; }
.topnav button:hover { background: var(--surface-2); color: var(--ink); }
.topnav button.on { background: var(--c-soft); color: var(--c-strong); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.streak { display: flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); }
.streak .ico { color: var(--gold); fill: var(--gold); }
.streak b { color: var(--ink); }
.sync { font-size: 12px; color: var(--muted); padding: 3px 9px; border-radius: 99px; background: var(--surface-2); white-space: nowrap; }
.sync[data-s="cloud"] { color: var(--ok); background: var(--ok-soft); }
.sync[data-s="error"] { color: var(--warn); background: var(--warn-soft); }
@media (max-width: 640px) {
  .brand-s, .sync, .streak { display: none; }
  .topnav button span { display: none; }
  .top-row { gap: 6px; }
}

/* home */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px 36px; padding-block: 34px 10px; align-items: center; }
.hh-text h1 { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.08; letter-spacing: -.02em; margin: 6px 0 12px; }
.hh-text p { color: var(--muted); max-width: 46ch; margin: 0 0 14px; font-size: 16px; }
.hh-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.hh-stats span { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; padding: 5px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.hh-stats .ico { color: var(--gold); fill: var(--gold); }
.continue { position: relative; display: grid; text-align: left; gap: 2px; padding: 22px 76px 22px 24px; border-radius: 20px; border: 0; cursor: pointer; color: oklch(99% 0 0); background: linear-gradient(135deg, oklch(56% 0.17 var(--h)), oklch(46% 0.17 calc(var(--h) + 35))); box-shadow: 0 14px 36px oklch(50% 0.17 var(--h) / .32); overflow: hidden; transition: transform .2s; }
.continue::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: oklch(100% 0 0 / .1); }
.continue:hover { transform: translateY(-2px); }
.cont-k { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.cont-ch { font-size: 13.5px; opacity: .9; }
.cont-l { font-family: var(--display); font-size: 23px; line-height: 1.25; }
.cont-m { font-size: 13px; opacity: .85; }
.cont-go { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; background: oklch(100% 0 0); color: oklch(45% 0.17 var(--h)); display: grid; place-items: center; z-index: 1; }
.cont-go .ico { fill: currentColor; width: 18px; height: 18px; }
.review-chip { grid-column: 1 / -1; justify-self: start; display: flex; gap: 8px; align-items: center; padding: 9px 16px; border-radius: 99px; border: 1.5px solid var(--warn); background: var(--warn-soft); color: var(--ink); font: 14px var(--body); cursor: pointer; }
.map { padding-block: 18px 80px; display: grid; gap: 34px; }
.map-h { display: flex; gap: 9px; align-items: center; font-family: var(--display); font-size: 19px; margin: 0 0 12px; }
.map-h .ico { color: var(--c); }
.tiles-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.ctile { position: relative; display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 18px 18px 14px; border-radius: 18px; cursor: pointer; color: var(--ink); border: 1.5px solid oklch(var(--Lm) 0.08 var(--h) / .45); background: radial-gradient(120% 90% at 100% 0%, oklch(var(--Ls) calc(var(--Cs) * 1.6) var(--h)) 0%, var(--surface) 62%); font: inherit; transition: transform .2s, box-shadow .2s; overflow: hidden; min-height: 168px; }
.ctile:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 12px 30px oklch(50% 0.12 var(--h) / .16); }
.ct-no { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: 40px; line-height: 1; color: oklch(var(--Lm) var(--Cm) var(--h)); margin-bottom: 4px; }
.ct-cls { font: 600 11.5px var(--mono); color: var(--muted); letter-spacing: .04em; }
.ct-title { font-family: var(--display); font-size: 17px; line-height: 1.3; }
.ct-blurb { font-size: 13px; color: var(--muted); line-height: 1.5; }
.ct-dots { display: flex; gap: 4px; margin-top: auto; padding-top: 10px; }
.ct-dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); }
.ct-dots i.on { background: oklch(var(--Lm) var(--Cm) var(--h)); }
.ct-meta { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); align-items: center; }
.ct-meta .ico { color: var(--gold); fill: var(--gold); width: 13px; }
.ct-done { color: var(--ok); display: inline-flex; gap: 3px; align-items: center; }
.ct-done .ico { color: var(--ok); fill: none; }
.ctile.soon { opacity: .6; cursor: default; }
.ct-soon { margin-top: auto; font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ct-soon::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: oklch(var(--Lm) var(--Cm) var(--h)); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (max-width: 760px) { .home-hero { grid-template-columns: minmax(0, 1fr); padding-block: 22px 6px; } }

/* chapter page */
.ch-hero { color: oklch(99% 0 0); background: linear-gradient(135deg, oklch(52% 0.16 var(--h)), oklch(42% 0.15 calc(var(--h) + 35))); }
.ch-hero-in { padding-block: 16px 26px; display: grid; gap: 14px; }
.crumb { justify-self: start; display: inline-flex; gap: 5px; align-items: center; background: oklch(100% 0 0 / .14); color: inherit; border: 0; border-radius: 99px; padding: 5px 12px 5px 8px; font: 600 13px var(--body); cursor: pointer; }
.pr-top .crumb { background: var(--c-soft); color: var(--c-strong); }
.ch-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.ch-no { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: clamp(54px, 9vw, 92px); line-height: .9; opacity: .9; }
.ch-top h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; margin: 4px 0 6px; }
.ch-top p { margin: 0; opacity: .88; max-width: 60ch; }
.ch-top .eyebrow { color: inherit; opacity: .8; }
.ch-ring { position: relative; width: 74px; height: 74px; }
.ch-ring svg, .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: oklch(100% 0 0 / .22); stroke-width: 3.4; }
.ring-fg { fill: none; stroke: oklch(100% 0 0); stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 97.4; transition: stroke-dashoffset .9s cubic-bezier(.3, .7, .2, 1); }
.ch-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 15px var(--mono); }
.ch-hero .btn.primary { justify-self: start; background: oklch(100% 0 0); color: oklch(42% 0.16 var(--h)); }
@media (max-width: 640px) { .ch-top { grid-template-columns: auto minmax(0, 1fr); } .ch-ring { display: none; } }
.ch-body { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px; padding-block: 26px 80px; }
.sec-h { font-family: var(--display); font-size: 18px; margin: 0 0 12px; }
.lpath { position: relative; display: grid; gap: 10px; align-content: start; }
.lnode { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; transition: transform .15s, border-color .15s, box-shadow .2s; }
.lnode:hover { transform: translateX(3px); border-color: var(--c); }
.lnode:not(:last-of-type)::after { content: ""; position: absolute; left: 38px; bottom: -12px; width: 2px; height: 12px; background: var(--line); }
.ln-dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 800 18px var(--display); background: var(--surface-2); color: var(--muted); }
.lnode.done .ln-dot { background: var(--c); color: var(--c-ink); }
.lnode.next { border-color: var(--c); box-shadow: 0 0 0 4px var(--c-soft); }
.lnode.next .ln-dot { background: var(--c-soft); color: var(--c-strong); animation: pulse-ring 2s infinite; }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 oklch(60% 0.15 var(--h) / .4); } 70% { box-shadow: 0 0 0 10px oklch(60% 0.15 var(--h) / 0); } }
.ln-main { display: flex; flex-direction: column; min-width: 0; }
.ln-main b { font-size: 16px; }
.ln-main span { font-size: 12.5px; color: var(--muted); }
.ln-stars { display: flex; gap: 1px; }
.ln-stars i .ico { width: 17px; height: 17px; color: var(--line); fill: var(--line); }
.ln-stars i.on .ico { color: var(--gold); fill: var(--gold); }
.ch-side { display: grid; gap: 10px; align-content: start; }
.sidecard { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.sidecard:hover { border-color: var(--c); }
.sc-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--c-soft); color: var(--c-strong); }
.sidecard:nth-of-type(2) .sc-ico { background: oklch(var(--Ls) var(--Cs) calc(var(--h) + 120)); color: oklch(var(--Lk) var(--Ck) calc(var(--h) + 120)); }
.sidecard:nth-of-type(3) .sc-ico { background: oklch(var(--Ls) var(--Cs) 80); color: oklch(var(--Lk) var(--Ck) 80); }
.sidecard:nth-of-type(4) .sc-ico { background: oklch(var(--Ls) var(--Cs) calc(var(--h) + 210)); color: oklch(var(--Lk) var(--Ck) calc(var(--h) + 210)); }
.sc-t { display: flex; flex-direction: column; min-width: 0; }
.sc-t span { font-size: 12.5px; color: var(--muted); }
@media (max-width: 820px) { .ch-body { grid-template-columns: minmax(0, 1fr); } }

/* runner */
.runner { min-height: calc(100vh - var(--hdr)); display: flex; flex-direction: column; }
.rn-top { display: flex; gap: 12px; align-items: center; padding-block: 14px 8px; }
.rn-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.rn-title span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rn-title b { font-family: var(--display); font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rn-prog { display: flex; gap: 4px; padding-block: 2px 14px; }
.rn-prog i { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); transition: background .3s, transform .3s; }
.rn-prog i.reach { cursor: pointer; }
.rn-prog i.reach::after { content: ""; position: absolute; inset: -9px 0; }
.rn-prog i.reach:hover { transform: scaleY(1.8); }
.rn-prog i.seen { background: oklch(var(--Lm) 0.08 var(--h)); }
.rn-prog i.cur { background: var(--c); transform: scaleY(1.4); }
.rn-prog i.ok { background: var(--ok); }
.rn-prog i.bad { background: var(--bad); }
.rn-stage { flex: 1; width: 100%; max-width: 920px; padding-bottom: 24px; }
.rn-foot { position: sticky; bottom: 0; z-index: 10; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rn-foot-in { max-width: 920px; display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.rn-n { font: 600 13px var(--mono); color: var(--muted); margin-left: auto; }
.rn-next { min-width: 120px; }
@media (max-width: 520px) { .rn-prev span { display: none; } .rn-next { min-width: 0; } }

/* screen card */
.scr { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px clamp(16px, 3.4vw, 34px) 28px; box-shadow: var(--shadow); min-width: 0; }
.scr.in-r { animation: in-r .42s cubic-bezier(.2, .7, .2, 1); }
.scr.in-l { animation: in-l .42s cubic-bezier(.2, .7, .2, 1); }
@keyframes in-r { from { opacity: 0; transform: translateX(28px); } }
@keyframes in-l { from { opacity: 0; transform: translateX(-28px); } }
.scr-kick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.kick { display: inline-flex; gap: 6px; align-items: center; font: 700 12px var(--mono); letter-spacing: .06em; padding: 4px 10px; border-radius: 99px; --kh: var(--h); background: oklch(var(--Ls) var(--Cs) var(--kh)); color: oklch(var(--Lk) var(--Ck) var(--kh)); }
.kick .ico { width: 14px; height: 14px; }
.k-demo .kick { --kh: calc(var(--h) + 125); }
.k-check .kick { --kh: 80; }
.k-hands .kick { --kh: calc(var(--h) + 215); }
.scr-from { font-size: 12px; color: var(--muted); }
.scr-title { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; letter-spacing: -.01em; margin: 2px 0 16px; }
.scr-body { min-width: 0; }
.scr-body > * + * { margin-top: 14px; }
.scr.inline { margin-top: 12px; box-shadow: none; }

/* hook */
.scr-hook { padding: 0; overflow: hidden; border: 0; }
.scr-hook .scr-kick { position: absolute; margin: 18px 22px; z-index: 1; }
.scr-hook { position: relative; }
.scr-hook .kick { background: oklch(100% 0 0 / .18); color: oklch(99% 0 0); }
.hook { position: relative; min-height: 300px; display: flex; flex-direction: column; justify-content: center; padding: 64px clamp(20px, 5vw, 56px) 44px; color: oklch(99% 0 0); background: radial-gradient(90% 120% at 100% 0%, oklch(62% 0.17 calc(var(--h) + 40)), transparent 60%), linear-gradient(140deg, oklch(52% 0.17 var(--h)), oklch(40% 0.15 calc(var(--h) - 20))); overflow: hidden; }
.hook-art { position: absolute; right: -10px; bottom: -24px; width: 230px; height: 230px; opacity: .2; animation: float 6s ease-in-out infinite; }
.hook-art .ico { width: 100%; height: 100%; stroke-width: 1.1; }
@keyframes float { 50% { transform: translateY(-10px) rotate(-4deg); } }
.hook-big { position: relative; font-family: var(--display); font-weight: 800; font-size: clamp(25px, 4vw, 40px); line-height: 1.22; max-width: 22ch; animation: rise .6s cubic-bezier(.2, .7, .2, 1); }
.hook-sub { position: relative; margin-top: 14px; font-size: 17px; opacity: .9; max-width: 44ch; animation: rise .6s .15s cubic-bezier(.2, .7, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* idea / vs / list / recap */
.idea { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; align-items: start; }
.idea-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--c-soft); color: var(--c-strong); animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
.idea-ico .ico { width: 28px; height: 28px; }
.idea-body { font-size: 17.5px; line-height: 1.75; max-width: 62ch; }
.terms { display: flex; flex-wrap: wrap; gap: 8px; }
.term { display: inline-flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 10px; background: var(--k-soft); border: 1px solid oklch(var(--Lm) 0.08 var(--k) / .5); animation: pop .4s backwards; }
.term:nth-child(2) { animation-delay: .08s; } .term:nth-child(3) { animation-delay: .16s; } .term:nth-child(4) { animation-delay: .24s; }
.term b { font-family: var(--mono); font-size: 13.5px; color: var(--k-strong); }
.term i { font-style: normal; font-size: 13.5px; color: var(--muted); }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 14.5px; align-items: start; }
.note-tag { font: 700 11px var(--mono); padding: 2px 7px; border-radius: 5px; letter-spacing: .06em; margin-top: 2px; }
.note.tip { background: var(--c-soft); }
.note.tip .note-tag { background: var(--c); color: var(--c-ink); }
.note.trap { background: var(--bad-soft); }
.note.trap .note-tag { background: var(--bad); color: oklch(100% 0 0); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
.vs-p { border-radius: 16px; padding: 16px 18px; min-width: 0; animation: rise .5s backwards; }
.vs-a { --k: calc(var(--h) - 30); background: oklch(var(--Ls) var(--Cs) var(--k)); }
.vs-b { --k: calc(var(--h) + 150); background: oklch(var(--Ls) var(--Cs) var(--k)); animation-delay: .12s; }
.vs-h { display: flex; flex-direction: column; margin-bottom: 8px; }
.vs-h b { font-family: var(--display); font-size: 19px; color: oklch(var(--Lk) var(--Ck) var(--k)); }
.vs-h span { font-size: 13px; color: var(--muted); }
.vs-p ul { margin: 0 0 6px; padding-left: 18px; }
.vs-p li { margin: 4px 0; }
.vs-p pre.code { margin-top: 10px; background: var(--surface); }
.vs-mid { display: grid; place-items: center; }
.vs-mid span { font: 800 14px var(--display); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--surface); }
.vs-bottom { padding: 12px 16px; border-radius: 12px; background: var(--surface-2); font-size: 15px; }
@media (max-width: 680px) { .vs { grid-template-columns: minmax(0, 1fr); } .vs-mid { margin: -6px 0; } }
.tiles { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
.tile { border-radius: 16px; padding: 16px; background: var(--k-soft); animation: pop .45s var(--d) cubic-bezier(.3, 1.4, .5, 1) backwards; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--k-strong); color: var(--surface); font: 800 17px var(--display); margin-bottom: 6px; }
.tile b { font-family: var(--display); font-size: 17px; color: var(--k-strong); }
.tile p { margin: 0; font-size: 14px; }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
@keyframes pop { from { opacity: 0; transform: scale(.88); } }
.stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 4px; }
.star .ico { width: 54px; height: 54px; color: var(--line); fill: var(--surface-2); stroke-width: 1.4; }
.star.on .ico { color: oklch(70% 0.16 70); fill: var(--gold); animation: star-in .6s var(--d) cubic-bezier(.3, 1.8, .5, 1) backwards; }
@keyframes star-in { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.stars-t { text-align: center; color: var(--muted); font-size: 14px; }
ul.recap { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
ul.recap li { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; background: var(--c-soft); animation: rise .45s var(--d) backwards; font-size: 15.5px; }
ul.recap .ico { color: var(--ok); margin-top: 3px; }
.final { text-align: center; padding: 10px 0; }
.final-n { font-family: var(--display); font-size: 22px; }
.final-n b { font-size: 64px; color: var(--c); }

/* code */
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font: 13.5px/1.65 var(--mono); overflow-x: auto; white-space: pre; }
pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
pre.code.big { font-size: 15px; padding: 16px 18px; }
pre.lines { padding: 8px 0; }
pre.lines .ln { display: block; padding: 0 14px 0 0; border-left: 3px solid transparent; transition: background .25s, border-color .25s; }
pre.lines .ln i { display: inline-block; width: 2.6em; padding-right: .9em; text-align: right; color: var(--muted); opacity: .55; font-style: normal; user-select: none; }
pre.lines .ln.on { background: oklch(var(--Ls) 0.08 85); border-left-color: var(--gold); }
.tk { color: var(--tk); font-weight: 600; } .ts { color: var(--ts); } .tn { color: var(--tn); } .tc { color: var(--tc); font-style: italic; } .tf { color: var(--tf); } .ti { color: var(--ink); }
.console { margin: 0; background: oklch(22% 0.02 var(--h)); color: oklch(92% 0.04 145); border-radius: 12px; padding: 10px 14px; font: 13px/1.55 var(--mono); white-space: pre-wrap; min-height: 42px; }
.console.empty::before { content: "（还没有输出）"; color: oklch(70% 0.02 var(--h)); }
.console::before { color: oklch(70% 0.02 var(--h)); }

/* player */
.pl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.pl-b { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.pl-b:hover:not(:disabled) { border-color: var(--c); }
.pl-b:disabled { opacity: .35; }
.pl-play { display: inline-flex; gap: 6px; align-items: center; height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--c); color: var(--c-ink); font: 700 13.5px var(--body); cursor: pointer; }
.pl-play .ico { width: 15px; height: 15px; }
.pl-play .ico[viewBox] path[d^="M7 4.5"] { fill: currentColor; }
.pl-dots { flex: 1 1 100px; display: flex; gap: 4px; align-items: center; min-width: 80px; }
.pl-dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); transition: background .25s; }
.pl-dots i.d { background: oklch(var(--Lm) 0.08 var(--h)); }
.pl-dots i.on { background: var(--c); }
.pl-dots b { display: block; height: 6px; border-radius: 3px; background: var(--c); transition: width .3s; }
.pl-sp select { font: 12px var(--body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 6px; }
.cap { margin-top: 10px; padding: 12px 16px; border-radius: 14px; background: var(--c-soft); font-size: 15px; min-height: 50px; }
.cap.in { animation: cap .35s ease; }
@keyframes cap { from { opacity: .3; transform: translateY(3px); } }
.cap code { background: var(--surface); }

/* rows stage */
.rs-host { overflow-x: auto; padding-bottom: 2px; }
.rs { --rs-n: 2; min-width: min(var(--rs-min, 300px), 100%); font: 13.5px/1.4 var(--mono); }
.rs-head, .rc { display: grid; grid-template-columns: repeat(var(--rs-n), minmax(0, 1fr)); gap: 8px; align-items: center; }
.rs.has-badge .rs-head, .rs.has-badge .rc { grid-template-columns: repeat(var(--rs-n), minmax(0, 1fr)) minmax(7.5rem, auto); }
.rs-head { padding: 0 14px 6px; font-weight: 700; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.rs.grouped .rs-head { display: none; }
.rs-body { display: flex; flex-direction: column; gap: 6px; }
.rs.grouped .rs-body { flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 10px; }
.rc { position: relative; padding: 9px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: 0 1px 2px oklch(30% 0.03 var(--h) / .05); transition: opacity .42s, transform .42s, background-color .35s, border-color .35s, box-shadow .35s, max-height .42s, padding .42s, margin .42s; max-height: 80px; }
.rc-c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .35s; min-width: 0; }
.rc-c.dim, .rs-head span.dim { opacity: .18; }
.rc-c.flash { animation: flash 1.1s ease; border-radius: 4px; }
@keyframes flash { 0%, 35% { background: var(--gold); color: oklch(20% 0.02 80); } }
.rc-b { font: 600 12px var(--mono); justify-self: end; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); opacity: 0; transform: scale(.7); transition: opacity .3s, transform .3s; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.rc-b.on { opacity: 1; transform: none; }
.rc.enter { opacity: 0; transform: translateY(-8px) scale(.97); }
.rc.leave { opacity: 0; transform: translateX(24px); max-height: 0; padding-block: 0; margin-block: -3px; border-width: 0; }
.rc.st-focus { border-color: var(--gold); background: oklch(var(--Ls) 0.07 85); box-shadow: 0 0 0 4px oklch(80% 0.14 85 / .25); transform: scale(1.015); }
.rc.st-pass { border-color: var(--ok); background: var(--ok-soft); }
.rc.st-pass .rc-b { background: var(--ok); color: var(--surface); }
.rc.st-fail { opacity: .4; border-style: dashed; }
.rc.st-fail .rc-b { background: var(--bad-soft); color: var(--bad); }
.rc.st-new { border-color: var(--c); background: var(--c-soft); animation: pop .45s cubic-bezier(.3, 1.5, .5, 1); }
.rc.st-del { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.rc.st-warn { border-color: var(--null); background: var(--null-soft); }
.rc.st-dim { opacity: .35; }
.rc.st-focus .rc-b { background: var(--gold); color: oklch(20% 0.02 80); }
.bucket { flex: 1 1 200px; min-width: 180px; border-radius: 16px; padding: 10px; background: var(--k-soft); border: 1.5px solid oklch(var(--Lm) 0.09 var(--k) / .6); transition: opacity .4s, transform .4s; }
.bucket.enter { opacity: 0; transform: scale(.94); }
.bucket-h { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px; }
.bucket-h b { font: 700 14px var(--mono); color: var(--k-strong); }
.bucket-h span { font: 700 12px var(--mono); background: var(--k-strong); color: var(--surface); border-radius: 99px; padding: 1px 8px; }
.bucket-b { display: flex; flex-direction: column; gap: 5px; }
.bucket .rc { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 6px 10px; font-size: 12.5px; max-height: 120px; }
.bucket .rc-c { overflow: visible; text-overflow: clip; }
.bucket .rc-c.dim { display: none; }
.bucket .rc-b { margin-left: auto; }
.rs.grouped { min-width: 0; }

/* join */
.jv-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.jv-head .chips { flex: 1 1 300px; }
.venn-wrap { display: flex; align-items: center; gap: 8px; }
.venn { width: 150px; height: auto; }
.venn circle { fill: transparent; transition: fill .4s; }
.venn .v-o { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.venn .v-t { font: 9px var(--mono); fill: var(--muted); text-anchor: middle; }
.venn-wrap[data-t="inner"] .v-i, .venn-wrap[data-t="left"] .v-l, .venn-wrap[data-t="left"] .v-i, .venn-wrap[data-t="right"] .v-r, .venn-wrap[data-t="right"] .v-i, .venn-wrap[data-t="full"] .v-l, .venn-wrap[data-t="full"] .v-r, .venn-wrap[data-t="full"] .v-i { fill: oklch(var(--Lm) var(--Cm) var(--h) / .75); }
.venn-x { display: none; font-size: 12px; font-weight: 700; }
.venn-wrap[data-t="cross"] .venn { opacity: .25; }
.venn-wrap[data-t="cross"] .venn-x { display: block; }
.jv { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(130px, .7fr) minmax(0, 1fr); gap: 12px; align-items: center; }
.jv-side { min-width: 0; }
.jv-side .mini-h { margin-top: 0; }
.jv-mid { display: grid; place-items: center; }
.cmpbox { text-align: center; font: 12.5px/1.5 var(--mono); padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); animation: pop .3s ease; max-width: 100%; }
.cmpbox code { background: none; padding: 0; font-size: 11px; color: var(--muted); }
.cmp-v { font-size: 17px; font-weight: 700; }
.cmpbox.t { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.cmpbox.f { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.cmpbox.u { border-color: var(--null); background: var(--null-soft); color: var(--null); }
.cmpbox.idle { color: var(--muted); border-style: dashed; }
.cmpbox.idle .ico { width: 28px; height: 28px; }
.jv-res { max-width: 520px; }
.widget, .scr-body { container-type: inline-size; }
@container (max-width: 640px) { .jv { grid-template-columns: minmax(0, 1fr); } }

/* grid */
.gv-wrap { overflow-x: auto; }
.gv { display: grid; gap: 5px; font: 600 14px var(--mono); min-width: max-content; }
.gc { min-height: 42px; min-width: 2.6em; display: grid; place-items: center; padding: 6px; border-radius: 10px; background: var(--surface-2); border: 1.5px solid transparent; transition: background .35s, border-color .35s, opacity .35s, transform .35s; font-variant-numeric: tabular-nums; }
.gc.empty { background: transparent; border: 1.5px dashed var(--line); }
.gc.flash { animation: flash 1.1s ease; }
.gc.m-a { --k: 255; } .gc.m-b { --k: 155; } .gc.m-c { --k: 340; } .gc.m-d { --k: 70; }
.gc.m-a, .gc.m-b, .gc.m-c, .gc.m-d { background: oklch(var(--Ls) calc(var(--Cs) * 1.5) var(--k)); border-color: oklch(var(--Lm) var(--Cm) var(--k)); color: oklch(var(--Lk) var(--Ck) var(--k)); }
.gc.m-on { background: var(--c); color: var(--c-ink); transform: scale(1.04); }
.gc.m-off { opacity: .3; }
.gc.m-x { opacity: .4; text-decoration: line-through; background: var(--surface-2); }
.gc.m-focus { border-color: var(--gold); box-shadow: 0 0 0 3px oklch(80% 0.14 85 / .35); }
.gl { font: 600 12px var(--mono); color: var(--muted); display: grid; place-items: center; padding: 4px 8px; }

/* flow */
.flow { position: relative; }
.flow-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: center; }
.fnode { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 14px 16px; border-radius: 16px; background: var(--k-soft); border: 2px solid transparent; min-width: 110px; max-width: 200px; transition: transform .35s, border-color .35s, box-shadow .35s, opacity .35s; }
.fnode-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--k-strong); }
.fnode b { font-size: 14.5px; }
.fnode span { font: 12px var(--mono); color: var(--muted); }
.fnode.on { border-color: var(--k-strong); transform: translateY(-4px); box-shadow: 0 10px 24px oklch(50% 0.12 var(--k) / .25); }
.flow-arr { color: var(--muted); display: grid; place-items: center; }
.packet { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px oklch(80% 0.14 85 / .3), 0 0 18px oklch(80% 0.14 85 / .8); opacity: 0; pointer-events: none; z-index: 2; }
.packet.show { opacity: 1; }

/* heap / trace */
.heap, .trace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
.hp-right, .tr-right { display: grid; gap: 10px; min-width: 0; }
.tr-right .mini-h { margin: 0; }
.hp-mem { position: relative; display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 46px; padding: 12px; border-radius: 16px; background: var(--surface-2); min-height: 120px; }
.hp-col .mini-h { margin: 0 0 8px; }
.hp-names, .hp-objs { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
.hp-name { align-self: flex-start; font: 700 14px var(--mono); padding: 6px 12px; border-radius: 10px; background: var(--k-strong); color: var(--surface); animation: pop .35s; }
.hp-obj { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 2px solid var(--k-mid); animation: pop .35s; transition: opacity .3s; }
.hp-obj.orphan { opacity: .4; border-style: dashed; }
.hp-obj.flash { animation: flash 1.1s ease; }
.hp-t { font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--k-strong); }
.hp-v { font: 600 14px var(--mono); overflow-wrap: anywhere; }
.hp-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.hp-svg path { fill: none; stroke: var(--k-mid); stroke-width: 2.4; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .7s var(--d, 0ms) ease forwards; }
.hp-svg marker path { fill: var(--muted); stroke: none; animation: none; stroke-dasharray: none; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.tr-vars { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.tr-var { display: inline-flex; overflow: hidden; border-radius: 10px; border: 2px solid var(--k-mid); font: 13.5px var(--mono); transition: opacity .3s, transform .3s; }
.tr-var.enter { opacity: 0; transform: scale(.8); }
.tr-var b { background: var(--k-mid); color: oklch(18% 0.02 var(--k)); padding: 4px 9px; }
.tr-var span { padding: 4px 10px; background: var(--surface); }
.tr-var.flash span { animation: flash 1.1s ease; }
@container (max-width: 700px) { .heap, .trace { grid-template-columns: minmax(0, 1fr); } }

/* er */
.er-wrap { overflow-x: auto; padding: 4px 2px 8px; }
.er { position: relative; display: grid; gap: 54px 64px; align-items: start; padding: 6px; }
.er-svg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.er-svg svg { width: 100%; height: 100%; overflow: visible; }
.rel line { stroke: var(--muted); stroke-width: 2.2; transition: opacity .4s, stroke .3s; }
.rel.on line { stroke: var(--c); stroke-width: 3; }
.rel.hide { opacity: 0; }
.er-card circle { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
.rel.on .er-card circle { stroke: var(--c); fill: var(--c-soft); }
.er-card text { font: 700 11px var(--mono); fill: var(--ink); text-anchor: middle; }
.er-lab { font: 600 11.5px var(--body); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.ent { position: relative; z-index: 1; border-radius: 14px; background: var(--surface); border: 2px solid var(--k-mid); overflow: hidden; box-shadow: var(--shadow); transition: opacity .45s, transform .45s, box-shadow .3s; }
.ent.hide { opacity: 0; transform: scale(.9); }
.ent.on { box-shadow: 0 0 0 4px oklch(var(--Lm) var(--Cm) var(--k) / .35), var(--shadow); transform: translateY(-2px); }
.ent.pop-in { animation: pop .5s var(--d) backwards; }
.ent-h { display: flex; gap: 6px; align-items: center; padding: 7px 12px; background: var(--k-soft); color: var(--k-strong); }
.ent-h b { font: 700 14px var(--mono); }
.ent-c { display: flex; justify-content: space-between; gap: 8px; padding: 4px 12px; font: 12.5px var(--mono); border-top: 1px solid var(--line); }
.ent-c i { font-style: normal; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.ent-c i.pk { background: oklch(var(--Ls) 0.08 85); color: oklch(var(--Lk) var(--Ck) 70); }
.ent-c i.fk { background: var(--c-soft); color: var(--c-strong); }

/* split */
.fds { display: flex; flex-wrap: wrap; gap: 8px; }
.fd { display: inline-flex; gap: 6px; align-items: center; font: 600 13px var(--mono); padding: 5px 11px; border-radius: 99px; background: var(--surface-2); color: var(--muted); transition: all .3s; }
.fd.on { background: oklch(var(--Ls) 0.09 85); color: var(--ink); box-shadow: 0 0 0 2px var(--gold); }
.split[data-stage="table"] .fds, .split[data-stage="split"] .fds { opacity: .55; }
table.sp { border-collapse: separate; border-spacing: 0; font: 13px var(--mono); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
table.sp th, table.sp td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; transition: background .35s, box-shadow .35s; }
table.sp th { background: var(--surface-2); font-weight: 700; }
table.sp th .ico { width: 13px; height: 13px; color: oklch(var(--Lk) var(--Ck) 70); margin-right: 3px; }
table.sp tr:last-child td { border-bottom: 0; }
table.sp .pc { background: var(--k-soft); }
table.sp th.pc { background: var(--k-mid); color: oklch(18% 0.02 var(--k)); }
table.sp .fd-from { box-shadow: inset 0 0 0 2px var(--c); background: var(--c-soft); }
table.sp .fd-to { background: oklch(var(--Ls) 0.1 85); }
.sp-table { overflow-x: auto; transition: opacity .45s, transform .45s, max-height .5s; max-height: 900px; }
.split[data-stage="split"] .sp-table { opacity: .25; transform: scale(.97); }
.sp-parts { display: flex; flex-wrap: wrap; gap: 14px; }
.split:not([data-stage="split"]) .sp-parts { display: none; }
.sp-part { border-radius: 16px; padding: 10px; background: var(--k-soft); animation: rise .5s var(--d) backwards; max-width: 100%; overflow-x: auto; }
.sp-ph { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 0 4px 8px; }
.sp-ph b { font: 700 14px var(--mono); color: var(--k-strong); }
.sp-ph span { font-size: 12px; color: var(--muted); }

/* dom */
.dom-ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.dom-in { display: flex; flex-direction: column; }
.dom-in .mini-h { margin: 0 0 4px; }
.dom-in input { font: 600 16px var(--mono); padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--code-bg); color: var(--ink); width: 280px; max-width: 100%; }
.dom-in input:focus { border-color: var(--c); outline: none; }
.dom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.dom-src pre.code { max-height: 360px; overflow: auto; font-size: 12.5px; }
.dom-tree { min-width: 0; max-height: 400px; overflow: auto; padding-right: 4px; }
.dn { font: 12.5px/1.4 var(--mono); }
.dn-t { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 4px 8px; border-radius: 8px; border-left: 3px solid var(--k-mid); background: var(--surface-2); margin: 3px 0; transition: background .25s, transform .25s, box-shadow .25s; }
.dn-t span { color: var(--k-strong); font-weight: 600; }
.dn-t i { font-style: normal; color: var(--tf); }
.dn-t s { text-decoration: none; color: var(--ts); }
.dn-t em { font-style: normal; color: var(--muted); }
.dn-t.hit { background: oklch(var(--Ls) 0.1 85); box-shadow: 0 0 0 2px var(--gold); transform: translateX(4px); }
.dn-k { margin-left: 16px; }
.dom-res { padding: 12px 14px; border-radius: 14px; background: var(--c-soft); }
.dom-n b { font: 800 22px var(--display); color: var(--c-strong); }
.dom-py pre.code { margin: 6px 0; background: var(--surface); }
.dom-texts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dom-texts span { font-size: 13px; padding: 3px 9px; border-radius: 8px; background: var(--surface); animation: pop .3s; }
.dom-tasks { display: grid; gap: 6px; }
.dom-task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; border: 1.5px dashed var(--line); font-size: 14.5px; transition: all .3s; }
.dt-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 12px var(--mono); }
.dom-task i { color: var(--line); }
.dom-task.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.dom-task.ok i { color: var(--ok); animation: pop .4s; }
.dom-task.ok .dt-n { background: var(--ok); color: var(--surface); }
@container (max-width: 640px) { .dom { grid-template-columns: minmax(0, 1fr); } }

/* chart */
.chart-wrap { display: grid; gap: 14px; }
.chart-wrap.with-code { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); align-items: start; }
@container (max-width: 680px) { .chart-wrap.with-code { grid-template-columns: minmax(0, 1fr); } }
.chart-box { position: relative; background: var(--surface-2); border-radius: 16px; padding: 10px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart .gl { stroke: var(--line); stroke-width: 1; }
svg.chart .axis { stroke: var(--muted); stroke-width: 1.4; }
svg.chart .tick { font: 10.5px var(--mono); fill: var(--muted); }
svg.chart .alab { font: 12px var(--body); fill: var(--muted); }
svg.chart .ln-s { fill: none; stroke: var(--k-mid); stroke-width: 2.8; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawn 1.4s ease forwards; }
@keyframes drawn { to { stroke-dashoffset: 0; } }
svg.chart .dot { fill: var(--k-mid); stroke: var(--surface); stroke-width: 1.5; animation: pop .35s calc(var(--d) + .3s) backwards; transform-box: fill-box; transform-origin: center; }
svg.chart .bar { fill: var(--k-mid); transform-box: fill-box; transform-origin: bottom; animation: grow .7s var(--d) cubic-bezier(.3, 1.2, .5, 1) backwards; }
@keyframes grow { from { transform: scaleY(0); } }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; padding: 0 6px 4px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--k-mid); }
.replay { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; }

/* choice */
.q { font-size: 17.5px; font-weight: 600; line-height: 1.6; }
.opts { display: grid; gap: 8px; }
.opts.short { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: 15px/1.5 var(--body); cursor: pointer; transition: border-color .15s, background .2s, transform .12s; }
.opt:hover:not(:disabled) { border-color: var(--k-mid); transform: translateY(-1px); }
.opt:disabled { cursor: default; }
.opt-k { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 800 14px var(--display); background: var(--k-soft); color: var(--k-strong); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt-k { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-k { background: var(--bad); color: var(--surface); }
.opt:disabled:not(.right):not(.wrong) { opacity: .5; }
.opt.right { animation: pop .35s ease; }
.shake { animation: shake .45s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.why { padding: 12px 16px; border-radius: 14px; background: var(--surface-2); font-size: 15px; animation: rise .35s ease; }
.why.ok { background: var(--ok-soft); }
.why.ok b:first-child { color: var(--ok); }
.why.bad { background: var(--bad-soft); }
.why.bad b:first-child { color: var(--bad); }
.live { padding-top: 4px; }
.live .grid-wrap { border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 520px) { .opts.short { grid-template-columns: minmax(0, 1fr); } }

/* fill / order / sort / match */
pre.code.fill { white-space: pre-wrap; line-height: 2.2; font-size: 15px; }
.blank { font: 700 14.5px var(--mono); padding: 2px 6px; border: 0; border-bottom: 2.5px solid var(--c); background: var(--c-soft); color: var(--ink); border-radius: 6px 6px 0 0; margin: 0 2px; }
.blank:focus { outline: none; background: oklch(var(--Ls) 0.09 85); }
.blank.ok { border-color: var(--ok); background: var(--ok-soft); }
.blank.bad { border-color: var(--bad); background: var(--bad-soft); }
.ord-ans, .ord-pool { display: flex; flex-direction: column; gap: 6px; min-height: 52px; padding: 10px; border-radius: 14px; }
.ord-ans { background: var(--code-bg); border: 2px dashed var(--line); }
.ord-ans.empty::before { content: "点下面的块，按顺序加进来"; color: var(--muted); font-size: 13px; }
.ord-pool { flex-direction: row; flex-wrap: wrap; }
.blk { font: 13.5px var(--mono); text-align: left; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--k-mid); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: center; transition: border-color .2s, background .2s; }
.blk:hover { background: var(--k-soft); }
.blk > span:last-child { white-space: pre; }
.blk-n { font: 800 12px var(--display); color: var(--k-strong); min-width: 1ch; }
.blk-n:empty { display: none; }
.blk.ok { border-color: var(--ok); background: var(--ok-soft); }
.blk.bad { border-color: var(--bad); background: var(--bad-soft); }
.sort-pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 10px; border-radius: 14px; border: 2px dashed var(--line); }
.sort-pool.empty::before { content: "全部放好了，点「检查」"; color: var(--muted); font-size: 13px; }
.sort-buckets { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.sort-bk { border-radius: 16px; background: var(--k-soft); border: 2px solid oklch(var(--Lm) 0.09 var(--k) / .6); min-height: 110px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.sort-bk.over, .sort-bk:hover { box-shadow: 0 0 0 4px oklch(var(--Lm) var(--Cm) var(--k) / .3); }
.sort-bh { font: 700 14px var(--body); color: var(--k-strong); padding: 10px 12px 6px; }
.sort-bb { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; }
.sort-it { text-align: left; font: 14px/1.4 var(--body); padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: grab; box-shadow: 0 1px 3px oklch(30% 0.03 var(--h) / .1); transition: transform .15s, border-color .15s; }
.sort-it.sel { border-color: var(--gold); box-shadow: 0 0 0 3px oklch(80% 0.14 85 / .4); transform: scale(1.03); }
.sort-it.ok { border-color: var(--ok); background: var(--ok-soft); }
.sort-it.bad { border-color: var(--bad); background: var(--bad-soft); }
.sort-it em { display: block; font-style: normal; font-size: 12px; color: var(--bad); }
@media (max-width: 560px) { .sort-buckets { grid-template-columns: minmax(0, 1fr); } }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 26px; }
.m-col { display: flex; flex-direction: column; gap: 8px; }
.m-it { text-align: left; font: 14.5px/1.45 var(--body); padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: all .2s; }
.m-it:hover:not(:disabled) { border-color: var(--c); }
.m-it.sel { border-color: var(--gold); background: oklch(var(--Ls) 0.07 85); }
.m-it.done { border-color: var(--k-mid); background: var(--k-soft); color: var(--k-strong); font-weight: 600; cursor: default; animation: pop .35s; }
.m-it.no { border-color: var(--bad); background: var(--bad-soft); }

/* editor + sql */
.ed { position: relative; background: var(--code-bg); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.ed pre, .ed textarea { margin: 0; border: 0; padding: 12px 14px; font: 14px/1.6 var(--mono); letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; tab-size: 2; }
.ed pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.ed textarea { position: relative; display: block; width: 100%; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: var(--ink); outline: none; min-height: 44px; }
.ed textarea::selection { background: var(--c-soft); color: transparent; }
.ed:focus-within { border-color: var(--c); box-shadow: 0 0 0 3px var(--c-soft); }
.run-out:empty { display: none; }
.run-out { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.pop { animation: pop .3s ease; }
.fb { padding: 11px 15px; border-radius: 12px; font-size: 15px; }
.fb:empty { display: none; }
.fb.good { background: var(--ok-soft); }
.fb.good b { color: var(--ok); }
.fb.bad { background: var(--bad-soft); }
.fb.bad b { color: var(--bad); }
.hint { margin-top: 6px; padding: 9px 13px; border-radius: 10px; background: oklch(var(--Ls) 0.07 85); font-size: 14px; }
.solbox, .expbox, .aibox { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.aibox { background: var(--c-soft); border-color: transparent; }
.ai-out p { margin: 0 0 8px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; padding: 9px 13px; border-radius: 10px; background: var(--warn-soft); }

/* static grids */
.grid-wrap { overflow-x: auto; max-width: 100%; }
.run-out .grid-wrap { max-height: 360px; overflow: auto; }
table.grid { border-collapse: collapse; width: 100%; font: 13px/1.5 var(--mono); }
table.grid th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 700; padding: 7px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 6px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid .rn { color: var(--muted); width: 1%; text-align: right; font-weight: 400; }
table.grid.mini { width: auto; border: 1.5px solid var(--line); border-radius: 12px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
.grid-foot { font: 11.5px var(--mono); color: var(--muted); padding: 7px 11px; }
.sqlerr { padding: 11px 15px; background: var(--bad-soft); border-radius: 12px; }
.sqlerr-m { font: 13px var(--mono); color: var(--bad); overflow-wrap: anywhere; }
.sqlerr-why { font-size: 14px; margin-top: 4px; }
.okmsg { padding: 11px 15px; color: var(--ok); font-size: 14px; background: var(--ok-soft); }
.loading { padding: 16px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.loading.err { color: var(--bad); }
.spin { width: 15px; height: 15px; border: 2.5px solid var(--line); border-top-color: var(--c); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* practice */
.pr-top { padding-block: 18px 6px; }
.pr-top h1 { font-family: var(--display); font-size: 28px; margin: 8px 0 0; }
.pr-split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-block: 16px 80px; }
.split { display: grid; gap: 14px; }
.exlist { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(var(--hdr) + 12px); align-self: start; max-height: calc(100vh - var(--hdr) - 24px); overflow: auto; }
.ex-h { font-size: 13px; color: var(--muted); padding: 0 8px 8px; }
.ex-h b { color: var(--ink); }
.ex { display: grid; grid-template-columns: 18px auto minmax(0, 1fr); gap: 7px; align-items: baseline; text-align: left; padding: 7px 9px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: 13.5px/1.35 var(--body); cursor: pointer; }
.ex:hover { background: var(--surface-2); color: var(--ink); }
.ex.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.ex-s { color: var(--ok); }
.ex-s .ico { width: 14px; height: 14px; }
.ex.tried .ex-s { color: var(--warn); }
.ex-id { font: 700 11.5px var(--mono); color: var(--c-strong); }
.ws { min-width: 0; display: grid; gap: 12px; align-content: start; }
.ws h2 { font-family: var(--display); font-size: 26px; margin: 0; }
.prompt { font-size: 16.5px; max-width: 70ch; margin: 0; }
.cols-need { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cols-need .mini-h { margin: 0; }
.hints { display: grid; gap: 6px; }
.hints:empty { display: none; }
.pr-nav { display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); }
.sch-wrap summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
.ws .sch-wrap { border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; background: var(--surface); }
.schema { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 10px 0; }
.sch-t { border: 1.5px solid var(--k-mid); border-radius: 12px; overflow: hidden; font: 12.5px/1.5 var(--mono); background: var(--surface); }
.sch-h { display: flex; justify-content: space-between; padding: 6px 10px; background: var(--k-soft); color: var(--k-strong); }
.sch-h span { color: var(--muted); font-size: 11.5px; }
.sch-c { display: flex; justify-content: space-between; gap: 8px; padding: 3px 10px; border-top: 1px solid var(--line); }
.sch-ty { color: var(--muted); font-size: 11.5px; }
.pk { font-style: normal; font-size: 10px; padding: 0 4px; border-radius: 3px; margin-right: 4px; background: oklch(var(--Ls) 0.08 85); color: oklch(var(--Lk) var(--Ck) 70); }
@media (max-width: 860px) {
  .pr-split { grid-template-columns: minmax(0, 1fr); gap: 12px; }

    oral: [
      { id: 'o1', q: 'SQL is described as a declarative language. What does that mean, and how is it different from writing procedural code like a Python loop or Pandas?', zh: '解释「声明式」，并和过程式对比。',
        points: ['States WHAT result is wanted, not HOW to compute it', 'The database engine / query optimizer chooses the execution plan', 'Procedural code: you control the algorithm, order of steps, storage and copies', 'Benefit: the same query can get faster as the database improves'],
        model: 'Declarative means I describe the result I want, which rows and which columns, and the database decides how to produce it. The query optimizer picks the algorithms, the access path and the order of operations. In procedural code, like a Python loop or a chain of Pandas operations, I control every step, so performance depends on my own choices. A nice side effect is that the same SQL can get faster when the database software or hardware improves, without me changing anything.' },
      { id: 'o2', q: 'Explain the difference between WHERE and HAVING. When would you use each?', zh: 'WHERE 和 HAVING 的区别。',
        points: ['WHERE filters individual rows before grouping', 'HAVING filters groups after GROUP BY', 'Aggregates like COUNT or AVG are allowed in HAVING but not in WHERE', 'Gives a concrete example'],

        notes: [
          { lines: [2, 3, 4], text: '放在 FROM / JOIN 里的子查询叫 <b>derived table（派生表）</b>：先算出一张 6 行的小表，每门课一个平均分。' },

    { id: 'o1', q: 'What is the difference between WHERE and HAVING? Give an example where moving a condition from one to the other changes the answer.',
      zh: 'WHERE 和 HAVING 的区别，举例说明',
      points: [
        'WHERE filters individual rows before grouping; HAVING filters groups after aggregation',
        'WHERE cannot use aggregate functions such as COUNT or AVG; HAVING can',
        'Example: credits > 50 in WHERE vs AVG(credits) > 50 in HAVING answer different questions',
        'Plain-column conditions belong in WHERE so less data reaches the grouping step',
      ],
      model: "WHERE is applied to individual rows before any grouping happens, and HAVING is applied to whole groups after the aggregates are computed. That's why you can't write COUNT(*) in a WHERE clause, but you can in HAVING. For example, if I put credits > 50 in WHERE and then average credits by major, I'm averaging only the high-credit students. If I group first and write HAVING AVG(credits) > 50, I keep whole majors whose average is above 50, which is a different question with a different answer. As a rule, conditions on plain columns go in WHERE, because filtering early means less work for the grouping step." },
    { id: 'o2', q: 'When would you use UNION versus UNION ALL?',
      zh: 'UNION 和 UNION ALL 怎么选',
      points: [
        'Both stack two result sets vertically; the column count must match and the names come from the first SELECT',
        'UNION removes rows that are identical across all columns; UNION ALL keeps every row',
        'UNION has to sort or hash to find duplicates, so it is slower',
        'Default to UNION ALL; use UNION only when the result must be distinct',
      ],
      model: "Both operators stack the results of two queries on top of each other, so the queries need the same number of columns, and the column names come from the first one. UNION removes duplicate rows, where a duplicate means every column matches, while UNION ALL keeps everything. Removing duplicates means the database has to sort or hash the combined result, so UNION is slower. I default to UNION ALL, for example when combining online and in-store transactions, because every transaction should count. I switch to UNION only when the question is about distinct values, like which department codes appear anywhere." },
    { id: 'o3', q: 'What is a correlated subquery, and why can it be slow? How would you rewrite one?',
      zh: '相关子查询为什么慢，怎么改写',
      points: [
        'A correlated subquery references a column from the current outer row',
        'Logically it is re-evaluated once per outer row, so the work grows like n × m',
        'An uncorrelated subquery runs once and is used as a constant',
        'Rewrite: aggregate once with GROUP BY in a derived table, then JOIN back (or add an index)',
      ],
      model: "A correlated subquery is a subquery that refers to a column of the outer query's current row, for example comparing each enrollment's grade to the average grade of that same course. Because it depends on the outer row, it is logically evaluated once per outer row, so with large tables the work grows roughly like the outer rows times the inner rows. An uncorrelated subquery, by contrast, runs once and its result is reused as a constant. To speed up the correlated version, I compute all the course averages once with GROUP BY in a derived table and join that back on the course name. The optimizer sometimes does this for me, and an index on the correlated column also helps, but I don't rely on that." },
    { id: 'o4', q: 'Can an IN subquery always be replaced by a JOIN? What can go wrong?',
      zh: 'IN 子查询能否换成 JOIN',
      points: [
        'IN only tests membership, so each outer row appears at most once',
        'A JOIN outputs one row per matching pair, so one-to-many relationships duplicate rows',
        'Fix with SELECT DISTINCT or by joining to a de-duplicated or aggregated subquery',
        'Use a JOIN when you need columns from the other table; optimizers often turn IN into a semi-join anyway',
      ],
      model: "Not blindly. IN just asks whether a value is in a set, so each outer row shows up at most once. A JOIN produces one output row for every matching pair, so if the relationship is one-to-many, rows get duplicated. For example, students who took any CSE course gives sixteen students with IN, but twenty-four rows with a JOIN to enrollments, because several students took two CSE courses. So I use a JOIN when I need columns from the other table, and add DISTINCT or join to a de-duplicated subquery when I only need membership. Performance-wise, modern optimizers usually turn IN into a semi-join, so the two are often similar." },
  ],
});

      { t: 'quiz', title: '复习：UNION 怎么去重',
        q: '<code>SELECT customer_id, total FROM orders WHERE channel = \'online\'<br>UNION<br>SELECT customer_id, total FROM orders WHERE channel = \'store\';</code><br>Ava（customer_id = 1）一共下了 4 单，金额各不相同。她在结果里出现几次？',
        opts: ['1 次：UNION 会去重', '4 次：去重要整行都相同', '2 次：每个渠道一次', '0 次'],
        a: 1,
        why: 'UNION 按<b>整行</b>去重：(1, 8.5)、(1, 18) 是不同的行，都保留。只有 Chloe 店里两单都是 (3, 12.0)，合成一行 → 结果 17 行；UNION ALL 不去重，18 行。<br><b>课件小误导</b>：它把类似的 UNION 查询叫作 "List of all customers"，但 SELECT 了金额列就不是顾客名单——要名单只 SELECT 顾客那一列。' },

      { t: 'rows', title: 'INTERSECT 一步步',

      { t: 'sql', title: '轮到你：交集',
        task: '用 <b>INTERSECT</b> 找出两个渠道都买过的顾客<b>名字</b>（只输出 name 一列）。上半句已经写好了。',
        sql: "SELECT c.name\nFROM orders o JOIN customers c ON o.customer_id = c.customer_id\nWHERE o.channel = 'online'\n-- 在下面接上 INTERSECT 和「店里」那半句\n",
        check: "SELECT c.name FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE o.channel = 'online'\nINTERSECT\nSELECT c.name FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE o.channel = 'store';",
        hint: '下半句和上半句一模一样，只把 \'online\' 换成 \'store\'。' },

      { t: 'predict', title: '两张不同的表也行？',
        code: 'SELECT customer_id FROM customers\nEXCEPT\nSELECT customer_id FROM orders;',
        lang: 'sql', run: true,
        q: '结果是？',
        opts: ['8', '空结果', '1, 2, 3, 4, 5, 6, 7', '报错：两张表结构不同'],
        a: 0,
        why: '所有顾客 {1…8} 减去下过单的 {1…7} = {8}，也就是从没下过单的 Hugo。集合运算只比较<b>列值</b>，不管来自哪张表——只要两边列数相同、类型兼容。' },

      { t: 'vs', title: 'EXCEPT 还是 MINUS？',
        a: { name: 'EXCEPT', sub: 'SQL 标准写法', points: ['SQLite、PostgreSQL、SQL Server 都用它', 'MySQL 8.0.31 起也支持', '本站跑的是 SQLite：<b>只认 EXCEPT</b>'], code: 'SELECT ...\nEXCEPT\nSELECT ...;', lang: 'sql' },
        b: { name: 'MINUS', sub: 'Oracle 的传统名字', points: ['含义完全相同：A 有、B 没有', 'Oracle 21c 起也接受 EXCEPT', '在 SQLite 里写 MINUS → <i>syntax error</i>'], code: 'SELECT ...\nMINUS\nSELECT ...;', lang: 'sql' },
        bottom: '同一个概念（差集），两个名字。考试和本站都写 <b>EXCEPT</b>；看到 MINUS 认得出来就行。' },

      { t: 'quiz', title: '读懂 EXCEPT 的结果',
        q: '对下面这张 <code>faculty</code> 表运行：<br><code>SELECT id, name FROM faculty WHERE dept = \'CS\'<br>EXCEPT<br>SELECT id, name FROM faculty WHERE dept = \'MechE\';</code><br>结果是？',
        table: { head: ['id', 'name', 'dept'], rows: [[21, 'Lin', 'CS'], [22, 'Mora', 'CS'], [22, 'Mora', 'MechE'], [23, 'Patel', 'MechE']] },
        opts: ['只有 Lin', 'Lin 和 Patel', '只有 Mora', 'Lin、Mora、Patel'],
        a: 0,
        why: '{Lin, Mora} − {Mora, Patel} = {Lin}。<br><b>课件这页的描述不准确</b>：它说这条查询返回"所有没有双聘（CS + MechE）的教师"，可 Patel 也没有双聘，却不在结果里——EXCEPT 只返回<b>第一个查询</b>里的行。准确说法是"CS 教师中没有同时在 MechE 任职的"。另外课件里的 ‘CS’ 是弯引号，复制进 SQL 会报错，要用直引号 \'CS\'。' },

      { t: 'code', title: '集合运算的规矩', lang: 'sql',
        code: "SELECT customer_id, name AS who\nFROM customers\nWHERE city = 'Clayton'\nUNION\nSELECT customer_id, name\nFROM customers\nWHERE city = 'Kirkwood'\nORDER BY who;",
        notes: [
          { line: 0, text: '结果的列名取自<b>第一个</b> SELECT —— 这里第二列叫 who。' },
          { lines: [0, 4], text: '两边<b>列数必须相同</b>（2 = 2），对应位置的类型要兼容；按<b>位置</b>配对，不按列名。' },
          { line: 3, text: 'UNION、INTERSECT、EXCEPT 都会<b>去重</b>；只有 UNION ALL 保留重复。（INTERSECT ALL / EXCEPT ALL 在 PostgreSQL 有，SQLite 没有。）' },
          { line: 7, text: 'ORDER BY 只能写一次，放在整个组合查询的<b>最后</b>，对最终结果排序：Chloe、Emi、Finn、Hugo。' },
        ] },

      { t: 'quiz', title: 'ORDER BY 放哪？',
        q: '在 SQLite 里，哪一条会<b>报错</b>？',
        opts: ['SELECT a FROM t1 UNION SELECT a FROM t2 ORDER BY a', 'SELECT a FROM t1 ORDER BY a UNION SELECT a FROM t2', 'SELECT a, b FROM t1 UNION ALL SELECT x, y FROM t2', 'SELECT a FROM t1 INTERSECT SELECT a FROM t2'],
        a: 1,
        why: 'ORDER BY 必须在整个组合查询之后。SQLite 的原话：<i>ORDER BY clause should come after UNION not before</i>。第 3 条列名不同没关系，按位置配对。' },

      { t: 'sort', title: '该用哪个？',
        q: '每个需求用哪种集合运算最自然？',
        buckets: ['UNION', 'INTERSECT', 'EXCEPT'],
        items: [
          ['合并两家分店结构相同的订单表', 0],
          ['两个渠道都买过的顾客', 1],
          ['注册了但从没下过单的顾客', 2],
          ['只在店里买过、从没网购过的顾客', 2],
          ['咖啡和烘焙两类都买过的顾客', 1],
          ['本月下过单「或」订阅了 newsletter 的人', 0],
        ],
        why: '「或」→ UNION；「既…又…」→ INTERSECT；「是…但不是…」→ EXCEPT。' },

      { t: 'fill', title: '补全：只在店里买过',
        q: '找出只在店里买过、从没在网上下单的顾客。',
        tpl: "SELECT customer_id FROM orders WHERE channel = 'store'\n{0}\nSELECT customer_id FROM orders WHERE channel = {1};",
        blanks: [{ a: ['EXCEPT'] }, { a: ["'online'"], cs: true }],
        lang: 'sql',
        why: '店里的 {1, 2, 3, 5, 6} 减去网上的 {1, 3, 4, 6, 7} = {2, 5}：Ben 和 Emi。字符串值用单引号，且大小写要和数据一致。' },

      { t: 'recap', points: [
        '<b>UNION</b> 并集、<b>INTERSECT</b> 交集、<b>EXCEPT</b> 差集：都按整行比较并<b>去重</b>（UNION ALL 除外）。',
        '<b>A EXCEPT B ≠ B EXCEPT A</b>：只返回第一个查询里的行。',
        '两边列数相同、类型兼容；列名取第一个 SELECT；ORDER BY 只能放最后。',
        '<b>MINUS</b> 是 Oracle 对 EXCEPT 的叫法；SQLite 只认 EXCEPT。',
      ] },
    ] },

    /* ───────────── b · 窗口函数入门 ───────────── */
    { id: 'b', title: '窗口函数：OVER 与排名', min: 6, screens: [
      { t: 'hook', big: '每件商品旁边，<br>标上「同类平均价」', sub: 'GROUP BY 会把 11 行压成 3 行——这次一行都不想丢', icon: 'window' },

      { t: 'vs', title: '压扁 vs 保留',

        b: { name: '窗口函数', sub: 'window function：每行都保留', points: ['每一行原样保留', '旁边多一列：这一行所在<b>窗口</b>的聚合值', '11 件商品 → 11 行'], code: 'SELECT name, category, price,\n  AVG(price) OVER (PARTITION BY category)\nFROM products;', lang: 'sql' },

              { k: 'cr', v: ['Croissant', 'Bakery', 3.5, '…'] }, { k: 'mu', v: ['Muffin', 'Bakery', 3.5, '…'] }, { k: 'sc', v: ['Scone', 'Bakery', 3, '…'] }, { k: 'ba', v: ['Bagel', 'Bakery', 2, '…'] },

      { t: 'predict', title: '会返回几行？',

      { t: 'fill', title: '两种窗口',
        q: '补全：每件商品的价格、<b>全店</b>平均价（不分区）、<b>同类</b>最高价。',

    { id: 'o1', q: 'What is the difference between a GROUP BY aggregate and a window function?',

      points: ['GROUP BY collapses each group into one row', 'a window function keeps every row and adds a computed column', 'OVER defines the window; PARTITION BY groups rows without collapsing them', 'concrete example, e.g. category average next to each product'],
      model: 'A GROUP BY aggregate collapses each group into a single row, so the individual rows disappear. A window function, which you recognize by the OVER clause, computes a value for every row from a set of related rows called its window, and it keeps all the rows. For example, AVG(price) OVER (PARTITION BY category) puts the category average right next to each product. PARTITION BY plays the role of GROUP BY, but nothing gets collapsed. That makes it easy to compare a row with its group, like price minus the category average.' },

      model: 'I would write AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), which averages the current day and the six rows before it. If I need it per store or per product, I add PARTITION BY first, then ORDER BY, then the frame; any other order is a syntax error. One pitfall is the start of the series: the first six rows average fewer than seven values, so I would either label them or start reporting on day seven. Another is that ROWS counts rows, not calendar days, so if a day is missing, the window silently covers more than a week. I would make sure there is exactly one row per day before trusting the number.' },
    { id: 'o4', q: 'What column constraints can you declare in CREATE TABLE, and does the database always enforce them?',

      points: ['NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK, plus DEFAULT', 'table-level constraints span several columns (composite key, named CHECK)', 'CHECK rejects only FALSE, so NULL passes; DEFAULT is not NOT NULL', 'enforcement varies: SQLite needs PRAGMA foreign_keys = ON and has loose typing; some warehouses treat keys as informational'],
      model: 'In CREATE TABLE I can declare NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY with REFERENCES, and CHECK conditions, and DEFAULT, which is not really a constraint but is written the same way. Rules that involve several columns, like a composite primary key or a CHECK comparing a start date with an end date, go at the table level, ideally with a CONSTRAINT name. Constraints catch data that is certainly wrong, but passing them does not prove the data is right; for example, CHECK lets NULL through because it only rejects FALSE. And they are not always enforced: SQLite ignores foreign keys unless you run PRAGMA foreign_keys = ON on each connection, and it lets a VARCHAR(5) column hold longer strings. Some data warehouses accept primary and foreign keys only as informational metadata for the optimizer.' },

        body: '<b>view</b>（视图）是一条存在数据库里的 SELECT，用起来像一张表。它通常<b>不存数据</b>：每次查 view，数据库都把那条 SELECT 重新跑一遍。',
        terms: [['view', '视图'], ['virtual table', '虚拟表'], ['stored query', '存起来的查询']],
        code: `CREATE VIEW upper_students AS

SELECT email    FROM upper_students;   -- 当表用

        tip: '<code>DROP VIEW upper_students;</code> 只删掉定义，底层的 students 表一行都不受影响。' },

        sql: `CREATE VIEW McKelvey.upper_students AS

        check: `CREATE VIEW McKelvey.upper_students AS SELECT id, name, email, credits FROM students WHERE credits >= 60;

        hint: '最后一行改成 <code>SELECT name FROM upper_students WHERE credits &gt; 100;</code>' },

      { t: 'predict', lang: 'sql', run: true,

        opts: ['12', '13', '报错：view 建好之后不能变'], a: 1,
        why: 'view 不存结果，只存查询。查它的时候 SELECT 重新跑一遍，所以新来的 Zoe（90 学分）自动出现。这就是 <b>virtual</b>（虚拟）的意思：永远是最新数据。' },

      { t: 'vs', title: '普通 view vs 物化 view',
        a: { name: 'Virtual view', sub: '普通 view',
          points: ['只存<b>查询定义</b>，不存数据', '每次访问都重新计算', '数据<b>永远最新</b>', '复杂的 view 被频繁访问 → 每次都慢'],
          code: 'CREATE VIEW v AS SELECT …;' },
        b: { name: 'Materialized view', sub: '物化视图',
          points: ['算一次，把<b>结果存到磁盘</b>', '读它和读普通表一样快', '底层数据变了 → 要 <b>refresh</b>，否则读到旧数据', '适合：计算很贵、数据很少变'],
          code: `-- PostgreSQL
CREATE MATERIALIZED VIEW mv AS SELECT …;
REFRESH MATERIALIZED VIEW mv;` },
        bottom: '<b>SQLite 没有 materialized view。</b>下面看替代办法。' },

      { t: 'rows', title: '物化 = 拍一张快照',
        sql: `CREATE TABLE course_stats AS
SELECT coursename, COUNT(*) AS n,

FROM enrollments GROUP BY coursename;`,
        cols: ['coursename', 'n', 'avg_grade'],
        rows: [
          { k: 'b', v: ['BME 2400', 3, 3.57] }, { k: 'c1', v: ['CSE 1301', 6, 3.17] }, { k: 'c2', v: ['CSE 2407', 8, 3.33] },
          { k: 'c3', v: ['CSE 3104', 10, 3.54] }, { k: 'm', v: ['MATH 2200', 7, 3.54] }, { k: 'p', v: ['PHYS 1910', 3, 2.77] },
        ],
        frames: [
          { text: '把聚合结果存成一张表 = 自己动手“物化”。以后读它不用再扫 enrollments。', lines: [0, 1, 2, 3] },
          { text: '后来 Charlie 也选了 PHYS 1910（成绩 4.0）。enrollments 里这门课已经是 4 人、平均 3.08。', hl: { p: 'focus' }, badge: { p: '真实：4 人 · 3.08' } },
          { text: '可快照里还是旧数字——这就是 <b>stale</b>（过期）数据。', hl: { p: 'warn' }, badge: { p: '过期' } },
          { text: '<b>refresh</b> = 重新算一遍。在 SQLite 里就是 DROP 掉再 CREATE TABLE … AS。', vals: { p: ['PHYS 1910', 4, 3.08] }, hl: { p: 'new' }, badge: { p: '已刷新' } },
        ] },

      { t: 'idea', title: 'SQLite 里怎么“物化”', icon: 'layers',
        body: 'SQLite 没有 <code>CREATE MATERIALIZED VIEW</code>。替代办法：<b>CREATE TABLE … AS SELECT</b> 把结果存成普通表；要更新时删掉重建。',
        code: `DROP TABLE IF EXISTS course_stats;   -- “refresh” = 删掉重建
CREATE TABLE course_stats AS
SELECT coursename, COUNT(*) AS n,
       ROUND(AVG(grade), 2) AS avg_grade
FROM enrollments
GROUP BY coursename;`,
        trap: '课件说底层数据一变，物化视图就会“触发重新计算”。这要看数据库：PostgreSQL <b>不会</b>自动刷新，必须手动 <code>REFRESH MATERIALIZED VIEW</code>，在那之前读到的都是旧数据；Oracle 可以设置成提交时自动刷新。' },

      { t: 'quiz', q: '课件说可以“通过 view 查询、更新、删除”。在 SQLite 里对上面的 view 运行这条 UPDATE，会怎样？',
        code: `UPDATE upper_students
SET credits = 61
WHERE id = 1;`,
        opts: ['改掉 students 表里 Alice 的 credits', '报错：cannot modify upper_students because it is a view', '只改 view 里的副本，students 不变'], a: 1,
        why: 'SQLite 的 view 是<b>只读</b>的（除非另写 INSTEAD OF trigger）。PostgreSQL、MySQL 允许更新“简单 view”（单表、没有聚合 / DISTINCT / GROUP BY），改动会落到底层表上。view 自己没有数据，所以第三项在哪儿都不成立。' },

      { t: 'sort', q: '该建一个 VIEW，还是直接写在这条查询里（子查询 / WITH）？',
        buckets: ['建 VIEW', '写在查询里'],
        items: [

          ['给助教一份学生名单，但不能让他看到 gpa', 0],
          ['下学期 students 要拆成两张表，旧报表不能坏', 0],
